        function getCreateItemsForRole(roleId) {
            const items = [];

            // Work Order hanya dibuat oleh TL. "Semua Peran" tetap boleh dipakai untuk demo/admin prototype.
            if (roleId === 'ALL') {
                items.push({ label: 'Work Order', icon: 'fa-file-circle-plus', action: "openNewWOModal()" });
            } else if (['TL_OP', 'TL_HAR', 'TL_KON'].includes(roleId)) {
                items.push({ label: 'Work Order', icon: 'fa-file-circle-plus', action: `openNewWOModal('${roleId}')` });
            }

            const activeWO = getActiveWO();
            if (activeWO) {
                syncWorkflow(activeWO);

                const pending = getPendingTasks(roleId).filter(task =>
                    task.woId === activeWO.id &&
                    CREATE_ENTRY_POINTS[`${task.journeyCode}:${task.nodeId}`]
                );

                pending.forEach(task => {
                    const meta = CREATE_ENTRY_POINTS[`${task.journeyCode}:${task.nodeId}`];
                    items.push({
                        label: meta.label,
                        icon: meta.icon,
                        action: `openTaskModal('${task.woId}', '${task.journeyCode}')`
                    });
                });
            }

            // Laporan bulanan adalah alur terpisah, tetapi hanya muncul setelah OPS_DONE mengaktifkannya.
            if (monthlyReportState.status !== 'NOT_STARTED' && monthlyReportState.node === 'n_a' &&
                (roleId === 'ALL' || roleId === 'PREPARATOR')) {
                const already = items.some(item => item.label === 'Laporan Bulanan');
                if (!already) {
                    items.push({
                        label: 'Laporan Bulanan',
                        icon: 'fa-book-open',
                        action: `openTaskModal('BULANAN', '14')`
                    });
                }
            }

            return items;
        }

        function renderCreateButton() {
            const wrap = document.getElementById('createMenuWrap');
            const menu = document.getElementById('createMenu');
            if (!wrap || !menu) return;

            const items = getCreateItemsForRole(currentRole);
            if (items.length === 0) {
                wrap.classList.add('hidden');
                menu.classList.add('hidden');
                menu.innerHTML = '';
                return;
            }

            wrap.classList.remove('hidden');
            menu.innerHTML = items.map(item => `
                <button onclick="${item.action}; closeCreateMenu()" class="w-full px-3 py-2.5 flex items-center gap-2.5 text-left hover:bg-neutral-100 active:bg-neutral-100 transition">
                    <span class="w-7 h-7 rounded-lg bg-pln-100 text-pln-900 flex items-center justify-center shrink-0">
                        <i class="fa-solid ${item.icon} text-xs"></i>
                    </span>
                    <span class="text-xs font-semibold">${item.label}</span>
                </button>
            `).join('');
        }

        function toggleCreateMenu(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('createMenu');
            if (menu) menu.classList.toggle('hidden');
        }

        function closeCreateMenu() {
            const menu = document.getElementById('createMenu');
            if (menu) menu.classList.add('hidden');
        }


        function renderWOSelector() {
            const select = document.getElementById('woSelector');
            const pill = document.getElementById('activeWOStatusPill');

            if (workOrders.length === 0) {
                activeWOId = null;
                select.innerHTML = '<option value="">Belum ada Work Order</option>';
                select.disabled = true;
                pill.className = 'hidden';
                pill.innerHTML = '';
                return;
            }

            select.disabled = false;
            if (!activeWOId || !workOrders.some(wo => wo.id === activeWOId)) {
                activeWOId = workOrders[0].id;
            }

            const orderedWOs = [...workOrders].sort((a, b) => Number(isEmergencyWO(b)) - Number(isEmergencyWO(a)));
            select.innerHTML = orderedWOs.map(wo => {
                const modePrefix = isEmergencyWO(wo) ? '[EMERGENCY] ' : (isProposedEmergencyWO(wo) ? '[EMERGENCY] ' : '');
                return `<option value="${wo.id}" ${wo.id === activeWOId ? 'selected' : ''}>${modePrefix}${wo.id} · ${wo.title}</option>`;
            }).join('');

            const activeWO = getActiveWO();
            const st = getStatusStyle(activeWO.overallStatus);
            pill.className = `text-xs font-bold px-2 py-0.5 rounded-full border shrink-0 flex items-center gap-1 ${st.bg}`;
            pill.innerHTML = `<i class="fa-solid ${st.icon}"></i><span>${st.label}</span>`;
        }


        function selectActiveWO(woId) {
            activeWOId = woId;
            renderWOSelector();
            renderCreateButton();
            renderMainView();
        }

        function switchTab(tab = 'work') {
            if (tab === 'managerial' && currentRole !== 'SPV') return;
            currentTab = ['work', 'documents', 'activity', 'managerial'].includes(tab) ? tab : 'work';
            closeCreateMenu();
            renderMainView();
        }

        function updateNavState() {
            const nav = document.getElementById('bottomNav');
            const work = document.getElementById('nav-work');
            const documents = document.getElementById('nav-documents');
            const activity = document.getElementById('nav-activity');
            const managerial = document.getElementById('nav-managerial');
            if (!nav || !work || !documents || !activity || !managerial) return;

            const showManagerial = currentRole === 'SPV';
            managerial.classList.toggle('hidden', !showManagerial);
            nav.style.gridTemplateColumns = showManagerial
                ? 'repeat(4, minmax(0, 1fr))'
                : 'repeat(3, minmax(0, 1fr))';

            [work, documents, activity, managerial].forEach(btn => {
                btn.classList.remove('text-pln-700', 'text-neutral-300');
                btn.classList.add('text-neutral-300');
            });

            let active = work;
            if (currentTab === 'documents') active = documents;
            else if (currentTab === 'activity') active = activity;
            else if (currentTab === 'managerial' && showManagerial) active = managerial;
            active.classList.remove('text-neutral-300');
            active.classList.add('text-pln-700');
        }

        function trackerStatusMeta(kind, detail = '') {
            const map = {
                DRAFT: { label: 'Draft', cls: 'bg-neutral-100 text-neutral-700 border-neutral-100', icon: 'fa-pen' },
                ACTION: { label: 'Perlu Aksi', cls: 'bg-yellow-100 text-yellow-900 border-yellow-300', icon: 'fa-circle-exclamation' },
                WAITING: { label: detail || 'Menunggu', cls: 'bg-pln-100 text-pln-900 border-pln-300', icon: 'fa-clock' },
                HOLD: { label: 'On Hold', cls: 'bg-yellow-100 text-yellow-900 border-yellow-300', icon: 'fa-circle-pause' },
                DONE: { label: 'Selesai', cls: 'bg-pln-100 text-pln-900 border-pln-300', icon: 'fa-circle-check' },
                STOPPED: { label: 'Dihentikan', cls: 'bg-red-100 text-red-700 border-red-300', icon: 'fa-circle-xmark' },
                PROCESS: { label: 'Proses', cls: 'bg-pln-100 text-pln-900 border-pln-300', icon: 'fa-spinner' }
            };
            return map[kind] || map.PROCESS;
        }

        function getTrackerItemsForRole(roleId) {
            const items = [];
            const allPending = getPendingTasks('ALL');

            workOrders.forEach(wo => {
                if (wo.overallStatus !== 'DRAFT') syncWorkflow(wo);

                const pendingForWO = allPending.filter(t => t.woId === wo.id);
                const candidateCodes = new Set();

                if (roleId === 'ALL') {
                    Object.entries(wo.flows).forEach(([code, state]) => {
                        if (state.started || state.status === 'ACTIVE' || state.status === 'DONE' || state.status === 'STOPPED') candidateCodes.add(code);
                    });
                    if (wo.overallStatus === 'DRAFT') candidateCodes.add('01');
                } else {
                    if (wo.initiatorRole === roleId) candidateCodes.add('01');
                    (wo.activityLog || []).filter(row => row.roleId === roleId).forEach(row => candidateCodes.add(row.journeyCode));
                    pendingForWO.filter(task => task.roleId === roleId).forEach(task => candidateCodes.add(task.journeyCode));
                }

                candidateCodes.forEach(journeyCode => {
                    const journey = JOURNEYS[journeyCode];
                    const flow = wo.flows[journeyCode];
                    if (!journey || !flow) return;

                    const pendingAny = pendingForWO.find(t => t.journeyCode === journeyCode);
                    const pendingMine = pendingForWO.find(t => t.journeyCode === journeyCode && (roleId === 'ALL' || t.roleId === roleId));
                    const currentNode = journey.nodes[flow.node];
                    const latest = latestJourneyActivity(wo, journeyCode);

                    let kind = 'PROCESS';
                    let detail = '';
                    if (wo.overallStatus === 'DRAFT' && journeyCode === '01') kind = 'DRAFT';
                    else if (pendingMine) kind = 'ACTION';
                    else if (wo.overallStatus === 'ON_HOLD') kind = 'HOLD';
                    else if (wo.overallStatus === 'STOPPED' || wo.overallStatus === 'CANCELLED' || flow.status === 'STOPPED') kind = 'STOPPED';
                    else if (flow.status === 'DONE' || (wo.overallStatus === 'COMPLETED' && journeyCode === '01')) kind = 'DONE';
                    else if (pendingAny) {
                        kind = 'WAITING';
                        detail = `Menunggu ${getRoleObj(pendingAny.roleId).short}`;
                    } else if (flow.status === 'WAITING') {
                        kind = 'WAITING';
                        detail = 'Menunggu proses';
                    }

                    const meta = trackerStatusMeta(kind, detail);
                    const responsibleRole = pendingAny ? getRoleObj(pendingAny.roleId) : null;
                    const latestText = latest
                        ? `${getRoleObj(latest.roleId).short}: ${latest.label}${latest.outcome ? ` · ${latest.outcome}` : ''}`
                        : (kind === 'DRAFT' ? 'Draft Work Order disimpan' : (currentNode?.label || 'Proses berjalan'));

                    let onclick = '';
                    let interactive = false;
                    if (kind === 'DRAFT' && (roleId === 'ALL' || wo.initiatorRole === roleId)) {
                        onclick = `openDraftWOModal('${wo.id}')`;
                        interactive = true;
                    } else if (pendingMine) {
                        onclick = `openTaskModal('${wo.id}', '${journeyCode}')`;
                        interactive = true;
                    }

                    items.push({
                        woId: wo.id,
                        woTitle: wo.title,
                        journeyCode,
                        journeyTitle: journey.title,
                        kind,
                        status: meta,
                        currentLabel: pendingAny?.nodeObj?.label || currentNode?.label || '',
                        responsibleRole,
                        latestText,
                        timeLabel: latest?.timeLabel || wo.createdAt || '',
                        onclick,
                        interactive,
                        isEmergency: isEmergencyWO(wo),
                        proposedEmergency: isProposedEmergencyWO(wo),
                        sortKey: latest?.id || (pendingMine ? 999999 : 0)
                    });
                });
            });

            const monthlyPending = allPending.find(t => t.journeyCode === '14');
            const monthlyRoleHistory = (monthlyReportState.activityLog || []).filter(row => row.roleId === roleId);
            const includeMonthly = monthlyReportState.status !== 'NOT_STARTED' &&
                (roleId === 'ALL' || monthlyPending?.roleId === roleId || monthlyRoleHistory.length > 0);

            if (includeMonthly) {
                const latest = (monthlyReportState.activityLog || []).slice(-1)[0];
                let kind = 'PROCESS';
                let detail = '';
                if (monthlyPending && (roleId === 'ALL' || monthlyPending.roleId === roleId)) kind = 'ACTION';
                else if (monthlyReportState.status === 'DONE') kind = 'DONE';
                else if (monthlyPending) {
                    kind = 'WAITING';
                    detail = `Menunggu ${getRoleObj(monthlyPending.roleId).short}`;
                }
                const meta = trackerStatusMeta(kind, detail);
                items.push({
                    woId: 'BULANAN',
                    woTitle: `Periode ${monthlyReportState.period}`,
                    journeyCode: '14',
                    journeyTitle: JOURNEYS['14'].title,
                    kind,
                    status: meta,
                    currentLabel: monthlyPending?.nodeObj?.label || JOURNEYS['14'].nodes[monthlyReportState.node]?.label || '',
                    responsibleRole: monthlyPending ? getRoleObj(monthlyPending.roleId) : null,
                    latestText: latest
                        ? `${getRoleObj(latest.roleId).short}: ${latest.label}${latest.outcome ? ` · ${latest.outcome}` : ''}${latest.note ? ` — Catatan: ${latest.note}` : ''}`
                        : 'Laporan bulanan aktif',
                    timeLabel: latest?.timeLabel || '',
                    onclick: monthlyPending && (roleId === 'ALL' || monthlyPending.roleId === roleId) ? `openTaskModal('BULANAN','14')` : '',
                    interactive: !!(monthlyPending && (roleId === 'ALL' || monthlyPending.roleId === roleId)),
                    isEmergency: false,
                    proposedEmergency: false,
                    sortKey: latest?.id || 0
                });
            }

            const urgencyRank = item => item.isEmergency ? 2 : (item.proposedEmergency ? 1 : 0);
            return items.sort((a, b) => urgencyRank(b) - urgencyRank(a) || b.sortKey - a.sortKey || a.woId.localeCompare(b.woId));
        }

        function workGroupMeta(groupKey) {
            const map = {
                ACTION: {
                    title: 'Perlu Tindakan',
                    subtitle: 'Pekerjaan yang sekarang membutuhkan aksi Anda.',
                    icon: 'fa-circle-exclamation',
                    iconBox: 'bg-yellow-100 text-yellow-900',
                    countBox: 'bg-yellow-100 text-yellow-900'
                },
                WAITING: {
                    title: 'Menunggu',
                    subtitle: 'Bagian Anda sudah selesai dan proses sedang berada di pihak lain.',
                    icon: 'fa-clock',
                    iconBox: 'bg-pln-100 text-pln-900',
                    countBox: 'bg-pln-100 text-pln-900'
                },
                HOLD: {
                    title: 'On Hold',
                    subtitle: 'Pekerjaan tertahan dan menunggu kendala diselesaikan.',
                    icon: 'fa-circle-pause',
                    iconBox: 'bg-yellow-100 text-yellow-900',
                    countBox: 'bg-yellow-100 text-yellow-900'
                },
                DONE: {
                    title: 'Selesai',
                    subtitle: 'Pekerjaan yang sudah selesai, dihentikan, atau dibatalkan.',
                    icon: 'fa-circle-check',
                    iconBox: 'bg-pln-100 text-pln-900',
                    countBox: 'bg-pln-100 text-pln-900'
                }
            };
            return map[groupKey];
        }

        function normalizeWorkGroup(kind) {
            if (kind === 'DRAFT' || kind === 'ACTION') return 'ACTION';
            if (kind === 'HOLD') return 'HOLD';
            if (kind === 'DONE' || kind === 'STOPPED') return 'DONE';
            return 'WAITING';
        }

        function renderWorkCard(item, groupKey) {
            const isAction = groupKey === 'ACTION' && item.interactive;
            const actionHint = item.kind === 'DRAFT'
                ? 'Ketuk untuk melanjutkan draft'
                : 'Ketuk untuk mengerjakan';
            const cardWO = item.woId !== 'BULANAN' ? workOrders.find(w => w.id === item.woId) : null;
            const cardDocumentStore = item.journeyCode === '14'
                ? monthlyReportState.documentData
                : cardWO?.documents?.[item.journeyCode];
            const hasPrintableDocument = !!DOCUMENT_SCHEMAS[item.journeyCode] && hasDocumentContent(cardDocumentStore);
            const cardDocumentOutput = hasPrintableDocument
                ? getDocumentOutputState(item.woId, item.journeyCode)
                : null;

            return `
                <div ${isAction ? `onclick="${item.onclick}"` : ''}
                     class="bg-white rounded-2xl border p-3 ${isAction ? 'border-yellow-300 cursor-pointer hover:border-yellow-500 active:scale-[0.99] transition shadow-sm' : 'border-neutral-100/90'}">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0">
                            <div class="flex items-center gap-1.5 min-w-0">
                                <span class="text-xs font-extrabold text-pln-700 truncate">${item.journeyTitle}</span>
                                <span class="text-xs text-neutral-300 shrink-0">· ${item.woId}</span>
                                ${item.isEmergency ? `<span class="shrink-0 rounded-full bg-red-100 text-red-700 border border-red-300 px-1.5 py-0.5 text-xs font-extrabold">EMERGENCY</span>` : ''}
                                ${item.proposedEmergency ? `<span class="shrink-0 rounded-full border border-red-300 bg-red-100 px-1.5 py-0.5 text-xs font-extrabold text-red-700">EMERGENCY</span>` : ''}
                            </div>
                            <div class="text-xs font-bold text-neutral-700 truncate mt-0.5">${item.woTitle}</div>
                        </div>
                        <span class="shrink-0 inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-xs font-bold ${item.status.cls}">
                            <i class="fa-solid ${item.status.icon}"></i>${item.status.label}
                        </span>
                    </div>

                    ${isAction ? `
                        <div class="mt-2 rounded-xl bg-yellow-100 border border-yellow-100 px-2.5 py-2 flex items-center justify-between gap-2">
                            <div class="min-w-0">
                                <div class="text-xs uppercase font-bold tracking-wide text-yellow-700">Aksi Anda</div>
                                <div class="text-xs font-bold text-neutral-700 truncate mt-0.5">${item.currentLabel || 'Lanjutkan pekerjaan'}</div>
                            </div>
                            <span class="shrink-0 text-xs font-bold text-yellow-900">${actionHint} <i class="fa-solid fa-chevron-right ml-1"></i></span>
                        </div>
                    ` : `
                        <div class="mt-2.5 rounded-xl bg-white border border-neutral-100 px-2.5 py-2">
                            <div class="text-xs uppercase font-bold tracking-wide text-neutral-300">Update terakhir</div>
                            <div class="text-xs font-semibold text-neutral-700 mt-0.5 leading-relaxed">${item.latestText}</div>
                            ${item.timeLabel ? `<div class="text-xs text-neutral-300 mt-0.5">${item.timeLabel}</div>` : ''}
                        </div>
                    `}

                    <div class="mt-2 flex items-center justify-between gap-2">
                        <div class="min-w-0">
                            <div class="text-xs text-neutral-300">Tahap saat ini</div>
                            <div class="text-xs font-semibold text-neutral-500 truncate">${item.currentLabel || '—'}</div>
                        </div>
                        ${item.responsibleRole ? `
                            <div class="text-right shrink-0">
                                <div class="text-xs text-neutral-300 mb-0.5">Sedang diproses oleh</div>
                                <span class="text-xs font-bold text-white px-2 py-0.5 rounded-full ${item.responsibleRole.color}">${item.responsibleRole.short}</span>
                            </div>
                        ` : ''}
                    </div>
                    ${hasPrintableDocument ? `
                        <button type="button" onclick="event.stopPropagation();openDocumentPreview('${item.woId}','${item.journeyCode}')" class="mt-2.5 w-full rounded-xl border border-neutral-100 bg-white text-neutral-700 text-xs font-semibold py-2 px-2.5 flex items-center justify-between gap-2">
                            <span class="flex items-center gap-1.5 min-w-0"><i class="fa-solid fa-file-lines text-pln-700"></i><span class="truncate">Lihat Dokumen</span></span>
                            <span class="shrink-0 rounded-lg px-1.5 py-0.5 text-xs font-bold ${cardDocumentOutput?.eligible ? 'bg-pln-100 text-pln-900' : 'bg-yellow-100 text-yellow-900'}">${esc(cardDocumentOutput?.label || 'Draft')}</span>
                        </button>
                    ` : ''}
                </div>
            `;
        }

        function renderWorkSection(groupKey, items) {
            if (!items.length) return '';
            const meta = workGroupMeta(groupKey);
            const cards = items.map(item => renderWorkCard(item, groupKey)).join('');

            if (groupKey === 'DONE') {
                return `
                    <details class="group rounded-2xl border border-neutral-100 bg-white overflow-hidden">
                        <summary class="list-none cursor-pointer px-3 py-3 flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <div class="w-8 h-8 rounded-xl ${meta.iconBox} flex items-center justify-center shrink-0"><i class="fa-solid ${meta.icon}"></i></div>
                                <div class="min-w-0">
                                    <div class="text-base font-bold text-neutral-700">${meta.title}</div>
                                    <div class="text-xs text-neutral-300 truncate">${meta.subtitle}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="rounded-full px-2 py-0.5 text-xs font-bold ${meta.countBox}">${items.length}</span>
                                <i class="fa-solid fa-chevron-down text-xs text-neutral-300 group-open:rotate-180 transition"></i>
                            </div>
                        </summary>
                        <div class="px-2.5 pb-2.5 space-y-2">${cards}</div>
                    </details>
                `;
            }

            return `
                <section>
                    <div class="flex items-center justify-between gap-2 mb-2 px-0.5">
                        <div class="flex items-center gap-2 min-w-0">
                            <div class="w-8 h-8 rounded-xl ${meta.iconBox} flex items-center justify-center shrink-0"><i class="fa-solid ${meta.icon}"></i></div>
                            <div class="min-w-0">
                                <div class="text-base font-bold text-neutral-700">${meta.title}</div>
                                <div class="text-xs text-neutral-300 truncate">${meta.subtitle}</div>
                            </div>
                        </div>
                        <span class="rounded-full px-2 py-0.5 text-xs font-bold ${meta.countBox}">${items.length}</span>
                    </div>
                    <div class="space-y-2">${cards}</div>
                </section>
            `;
        }

        function roleCanSeeDocument(roleId, wo, journeyCode) {
            if (!DOCUMENT_SCHEMAS[journeyCode]) return false;
            const store = journeyCode === '14' ? monthlyReportState.documentData : wo?.documents?.[journeyCode];
            if (!hasDocumentContent(store)) return false;
            if (roleId === 'ALL') return true;
            if (journeyCode === '01' && wo?.initiatorRole === roleId) return true;
            if (getDocumentRoleFields(journeyCode, roleId).length > 0) return true;
            if ((wo?.activityLog || []).some(row => row.roleId === roleId && row.journeyCode === journeyCode)) return true;
            if (journeyCode !== '14' && getPendingTasks(roleId).some(task => task.woId === wo?.id && task.journeyCode === journeyCode)) return true;
            if (journeyCode === '14') {
                const pending = getPendingTasks(roleId).some(task => task.journeyCode === '14');
                const history = (monthlyReportState.activityLog || []).some(row => row.roleId === roleId);
                return pending || history;
            }
            return false;
        }

        function saveDocumentPDFFromLibrary(woId, journeyCode) {
            const output = getDocumentOutputState(woId, journeyCode);
            if (!output.eligible) {
                showToast(`PDF belum tersedia. ${output.message}`, 'warning');
                return;
            }
            openDocumentPreview(woId, journeyCode, false);
            setTimeout(() => saveDocumentPDF(woId, journeyCode), 20);
        }

        function renderDocumentLibraryCard(woId, journeyCode) {
            const schema = DOCUMENT_SCHEMAS[journeyCode];
            if (!schema) return '';
            const output = getDocumentOutputState(woId, journeyCode);
            return `
                <div class="rounded-2xl border border-neutral-100 bg-white p-3">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0">
                            <div class="text-xs font-extrabold text-pln-700">${journeyCode} · ${esc(schema.title)}</div>
                            <div class="text-xs text-neutral-500 mt-1 leading-relaxed">${esc(output.message)}</div>
                        </div>
                        <span class="shrink-0 rounded-lg px-2 py-1 text-xs font-bold ${output.eligible ? 'bg-pln-100 text-pln-900' : 'bg-yellow-100 text-yellow-900'}">${esc(output.label)}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-2.5">
                        <button type="button" onclick="openDocumentPreview('${woId}','${journeyCode}')" class="rounded-xl border border-pln-300 bg-white text-pln-900 text-xs font-semibold py-2.5 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-eye"></i>Preview
                        </button>
                        <button type="button" ${output.eligible ? `onclick="saveDocumentPDFFromLibrary('${woId}','${journeyCode}')"` : 'disabled'} class="rounded-xl text-xs font-semibold py-2.5 flex items-center justify-center gap-1.5 ${output.eligible ? 'bg-yellow-500 text-neutral-900' : 'bg-neutral-100 text-neutral-300 cursor-not-allowed'}">
                            <i class="fa-solid ${output.eligible ? 'fa-file-pdf' : 'fa-lock'}"></i>${output.eligible ? 'Simpan PDF' : 'Belum Final'}
                        </button>
                    </div>
                </div>
            `;
        }

        function renderDocumentsTab() {
            const role = getRoleObj(currentRole);
            const wo = getActiveWO();
            const cards = [];

            if (wo) {
                Object.keys(DOCUMENT_SCHEMAS)
                    .filter(code => code !== '14')
                    .sort()
                    .forEach(code => {
                        if (roleCanSeeDocument(currentRole, wo, code)) {
                            cards.push(renderDocumentLibraryCard(wo.id, code));
                        }
                    });
            }

            if (roleCanSeeDocument(currentRole, null, '14')) {
                cards.push(renderDocumentLibraryCard('BULANAN', '14'));
            }

            return `
                <div class="mb-3">
                    <div class="text-xs font-semibold uppercase tracking-wide text-neutral-300">Dokumen</div>
                    <h2 class="text-lg font-bold text-neutral-700 mt-0.5">Dokumen ${role.short}</h2>
                    <p class="text-xs text-neutral-300 mt-1">Preview dan simpan PDF dokumen yang menjadi bagian pekerjaan Anda.</p>
                </div>
                ${cards.length ? `
                    <div class="space-y-2">${cards.join('')}</div>
                ` : `
                    <div class="bg-white rounded-2xl p-8 text-center border border-neutral-100/80">
                        <div class="w-11 h-11 rounded-2xl bg-pln-100 text-pln-700 flex items-center justify-center mx-auto mb-2 text-lg"><i class="fa-solid fa-folder-open"></i></div>
                        <div class="font-bold text-xs text-neutral-700">Belum ada dokumen</div>
                        <div class="text-xs text-neutral-300 mt-1">Dokumen akan muncul setelah Anda membuat, menerima, atau memproses dokumen dalam workflow.</div>
                    </div>
                `}
            `;
        }

        function activityTimestamp(row) {
            if (!row?.at) return row?.timeLabel || '—';
            try {
                return `${new Date(row.at).toLocaleString('id-ID', {
                    timeZone: 'Asia/Jakarta',
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                })} WIB`;
            } catch (e) {
                return row?.timeLabel || '—';
            }
        }

        function activityCategory(row) {
            if (row?.category === 'DOCUMENT') return 'DOCUMENT';
            if (row?.category === 'DECISION') return 'DECISION';
            const outcome = String(row?.outcome || '').toLowerCase();
            const decisionTerms = ['setuju', 'tolak', 'ya', 'tidak', 'layak', 'reguler', 'emergency', 'dibatalkan', 'dihentikan'];
            return decisionTerms.some(term => outcome.includes(term)) ? 'DECISION' : 'WORKFLOW';
        }

        function activityCategoryMeta(category) {
            if (category === 'DECISION') {
                return { label: 'Keputusan', icon: 'fa-scale-balanced', cls: 'bg-yellow-100 text-yellow-900 border-yellow-300' };
            }
            if (category === 'DOCUMENT') {
                return { label: 'Aktivitas Dokumen', icon: 'fa-file-lines', cls: 'bg-pln-100 text-pln-900 border-pln-300' };
            }
            return { label: 'Aktivitas', icon: 'fa-circle-dot', cls: 'bg-neutral-100 text-neutral-700 border-neutral-100' };
        }

        function activityOutcomeClass(outcome = '') {
            const value = String(outcome).toLowerCase();
            if (['tolak', 'tidak', 'batal', 'henti', 'gagal'].some(term => value.includes(term))) {
                return 'bg-red-100 text-red-700 border-red-300';
            }
            if (['setuju', 'sesuai', 'selesai', 'diajukan', 'disimpan', 'valid', 'layak', 'emergency fast track'].some(term => value.includes(term))) {
                return 'bg-pln-100 text-pln-900 border-pln-300';
            }
            return 'bg-neutral-100 text-neutral-700 border-neutral-100';
        }

        function setActivityScopeFilter(value) {
            activityScopeFilter = ['ACTIVE', 'ALL_WO', 'MONTHLY'].includes(value) ? value : 'ACTIVE';
            activityTypeFilter = 'ALL';
            activityJourneyFilter = 'ALL';
            activityActorFilter = 'ALL';
            activitySearchQuery = '';
            renderMainView();
        }

        function setActivityTypeFilter(value) {
            activityTypeFilter = value || 'ALL';
            renderMainView();
        }

        function setActivityJourneyFilter(value) {
            activityJourneyFilter = value || 'ALL';
            renderMainView();
        }

        function setActivityActorFilter(value) {
            activityActorFilter = value || 'ALL';
            renderMainView();
        }

        function applyActivitySearch() {
            activitySearchQuery = (document.getElementById('activitySearchInput')?.value || '').trim();
            renderMainView();
        }

        function clearActivitySearch() {
            activitySearchQuery = '';
            renderMainView();
        }

        function activityJourneyLabel(code) {
            return JOURNEYS[code]?.title || DOCUMENT_SCHEMAS[code]?.title || code || '—';
        }

        function filterActivityRows(rows) {
            const query = activitySearchQuery.toLowerCase();
            return rows.filter(row => {
                const typeOk = activityTypeFilter === 'ALL' || activityCategory(row) === activityTypeFilter;
                const journeyOk = activityJourneyFilter === 'ALL' || row.journeyCode === activityJourneyFilter;
                const actorOk = activityActorFilter === 'ALL' || row.roleId === activityActorFilter;
                const role = getRoleObj(row.roleId);
                const haystack = [
                    row.label,
                    row.outcome,
                    row.note,
                    row.username,
                    row.roleId,
                    role?.name,
                    activityJourneyLabel(row.journeyCode),
                    row._contextLabel,
                    activityTimestamp(row)
                ].map(v => String(v || '').toLowerCase()).join(' ');
                const searchOk = !query || haystack.includes(query);
                return typeOk && journeyOk && actorOk && searchOk;
            });
        }

        function renderActivityEntry(row, contextLabel = '') {
            const role = getRoleObj(row.roleId);
            const category = activityCategory(row);
            const meta = activityCategoryMeta(category);
            const journeyLabel = activityJourneyLabel(row.journeyCode);
            const username = row.username ? ` · ${esc(row.username)}` : '';
            return `
                <div class="relative pl-7 pb-4">
                    <div class="absolute left-[7px] top-1.5 bottom-0 w-px bg-neutral-100"></div>
                    <div class="absolute left-0 top-1.5 w-3.5 h-3.5 rounded-full border-2 border-white ${category === 'DECISION' ? 'bg-yellow-500' : (category === 'DOCUMENT' ? 'bg-pln-700' : 'bg-neutral-300')} shadow-sm"></div>
                    <div class="rounded-2xl border border-neutral-100 bg-white p-3">
                        <div class="flex items-start justify-between gap-2">
                            <div class="min-w-0">
                                <div class="text-xs font-extrabold text-neutral-700">${esc(row.label || 'Aktivitas')}</div>
                                <div class="text-xs text-neutral-300 mt-0.5">${esc(activityTimestamp(row))}</div>
                            </div>
                            <span class="shrink-0 inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-xs font-bold ${meta.cls}">
                                <i class="fa-solid ${meta.icon}"></i>${meta.label}
                            </span>
                        </div>

                        <div class="mt-2 grid grid-cols-1 gap-1.5 text-xs">
                            <div class="flex items-start gap-2">
                                <span class="w-20 shrink-0 text-neutral-300">Aktor</span>
                                <span class="font-semibold text-neutral-700">${esc(role.name)}${username}</span>

                            <div class="flex items-start gap-2">
                                <span class="w-20 shrink-0 text-neutral-300">Proses</span>
                                <span class="text-neutral-700">${esc(journeyLabel)}</span>
                            </div>
                            ${contextLabel ? `
                                <div class="flex items-start gap-2">
                                    <span class="w-20 shrink-0 text-neutral-300">Konteks</span>
                                    <span class="text-neutral-700">${esc(contextLabel)}</span>
                                </div>
                            ` : ''}
                            ${row.outcome ? `
                                <div class="flex items-start gap-2">
                                    <span class="w-20 shrink-0 text-neutral-300">Hasil</span>
                                    <span class="inline-flex w-fit rounded-lg border px-2 py-0.5 font-bold ${activityOutcomeClass(row.outcome)}">${esc(row.outcome)}</span>
                                </div>
                            ` : ''}
                            ${row.note ? `
                                <div class="mt-1 rounded-xl bg-yellow-100 border border-yellow-300 px-2.5 py-2">
                                    <div class="text-xs font-bold text-yellow-900">Catatan / Alasan</div>
                                    <div class="text-xs text-neutral-700 mt-0.5 whitespace-pre-wrap">${esc(row.note)}</div>
                                </div>
                            ` : ''}
                            ${row.bpmnRef ? `
                                <details class="mt-1 rounded-xl border border-neutral-100 bg-neutral-100/40 px-2.5 py-2">
                                    <summary class="cursor-pointer list-none flex items-center justify-between gap-2 text-xs font-semibold text-neutral-500">
                                        <span><i class="fa-solid fa-code-branch mr-1"></i>Detail audit</span>
                                        <i class="fa-solid fa-chevron-down text-xs text-neutral-300"></i>
                                    </summary>
                                    <div class="flex items-start gap-2 mt-2">
                                        <span class="w-20 shrink-0 text-neutral-300">BPMN ID</span>
                                        <code class="text-xs text-neutral-500 break-all">${esc(row.bpmnRef)}</code>
                                    </div>
                                </details>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderActivityFilters(rows) {
            const journeyCodes = [...new Set(rows.map(row => row.journeyCode).filter(Boolean))].sort();
            const typeButtons = [
                ['ALL', 'Semua'],
                ['DECISION', 'Keputusan'],
                ['WORKFLOW', 'Aktivitas'],
                ['DOCUMENT', 'Akt. Dokumen']
            ];
            return `
                <div class="rounded-2xl border border-neutral-100 bg-white p-3 mb-3">
                    <div class="text-xs font-bold text-neutral-700">Filter Riwayat</div>
                    <div class="text-xs text-neutral-300 mt-0.5 mb-2">Filter hanya mengubah daftar hasil di bawah, bukan angka Ringkasan Scope.</div>
                    <div class="grid grid-cols-4 gap-1.5">
                        ${typeButtons.map(([value, label]) => `
                            <button type="button" onclick="setActivityTypeFilter('${value}')" class="rounded-xl px-2 py-2 text-xs font-bold border ${activityTypeFilter === value ? 'bg-pln-700 text-white border-pln-700' : 'bg-white text-neutral-500 border-neutral-100'}">${label}</button>
                        `).join('')}
                    </div>
                    <div class="text-xs text-neutral-300 mt-2 leading-relaxed">
                        <b>Akt. Dokumen</b> mencakup simpan draft, preview, cetak, dan Simpan PDF; bukan jumlah dokumen yang tersedia.
                    </div>
                    <label class="block mt-2.5">
                        <span class="block text-xs font-semibold text-neutral-500 mb-1.5">Dokumen / Proses</span>
                        <select onchange="setActivityJourneyFilter(this.value)" class="w-full rounded-xl border border-neutral-100 bg-white p-2.5 text-sm text-neutral-700">
                            <option value="ALL" ${activityJourneyFilter === 'ALL' ? 'selected' : ''}>Semua dokumen & proses</option>
                            ${journeyCodes.map(code => `<option value="${esc(code)}" ${activityJourneyFilter === code ? 'selected' : ''}>${esc(activityJourneyLabel(code))}</option>`).join('')}
                        </select>
                    </label>
                    <label class="block mt-2.5">
                        <span class="block text-xs font-semibold text-neutral-500 mb-1.5">Aktor / Role</span>
                        <select onchange="setActivityActorFilter(this.value)" class="w-full rounded-xl border border-neutral-100 bg-white p-2.5 text-sm text-neutral-700">
                            <option value="ALL" ${activityActorFilter === 'ALL' ? 'selected' : ''}>Semua aktor</option>
                            ${[...new Set(rows.map(row => row.roleId).filter(Boolean))]
                                .sort((a, b) => getRoleObj(a).name.localeCompare(getRoleObj(b).name))
                                .map(roleId => `<option value="${esc(roleId)}" ${activityActorFilter === roleId ? 'selected' : ''}>${esc(getRoleObj(roleId).name)}</option>`)
                                .join('')}
                        </select>
                    </label>
                    <div class="mt-2.5">
                        <span class="block text-xs font-semibold text-neutral-500 mb-1.5">Cari Riwayat</span>
                        <div class="flex gap-1.5">
                            <input id="activitySearchInput" type="search" value="${esc(activitySearchQuery)}" onkeydown="if(event.key === 'Enter'){event.preventDefault();applyActivitySearch();}" placeholder="Aktivitas, hasil, alasan, aktor, WO, tanggal/waktu..." class="min-w-0 flex-1 rounded-xl border border-neutral-100 bg-white p-2.5 text-sm text-neutral-700">
                            <button type="button" onclick="applyActivitySearch()" class="rounded-xl bg-pln-700 text-white px-3 text-xs font-bold">Cari</button>
                            ${activitySearchQuery ? `<button type="button" onclick="clearActivitySearch()" class="rounded-xl border border-neutral-100 bg-white text-neutral-500 px-3 text-xs font-bold">Reset</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderActivityLogTab() {
            const activeWO = getActiveWO();
            const woContexts = workOrders.map(wo => ({
                context: wo.id,
                wo,
                rows: [...(wo.activityLog || [])]
            }));
            const monthlyRows = [...(monthlyReportState.activityLog || [])];

            let scopedRows = [];
            let scopeTitle = '';
            let scopeSubtitle = '';

            if (activityScopeFilter === 'ALL_WO') {
                scopedRows = woContexts.flatMap(item =>
                    item.rows.map(row => ({ ...row, _contextLabel: item.context }))
                );
                scopeTitle = 'Semua Work Order';
                scopeSubtitle = `${workOrders.length} WO tersedia dalam scope audit saat ini.`;
            } else if (activityScopeFilter === 'MONTHLY') {
                scopedRows = monthlyRows.map(row => ({ ...row, _contextLabel: monthlyReportState.period }));
                scopeTitle = 'Laporan Bulanan';
                scopeSubtitle = `Periode ${monthlyReportState.period || '—'}.`;
            } else {
                scopedRows = activeWO
                    ? [...(activeWO.activityLog || [])].map(row => ({ ...row, _contextLabel: activeWO.id }))
                    : [];
                scopeTitle = activeWO ? `WO Aktif · ${activeWO.id}` : 'WO Aktif';
                scopeSubtitle = activeWO
                    ? `${activeWO.title || 'Work Order'}`
                    : 'Belum ada Work Order aktif.';
            }

            const filteredRows = filterActivityRows(scopedRows)
                .sort((a, b) => (b.at || b.id || 0) - (a.at || a.id || 0));

            const totalDecisions = scopedRows.filter(row => activityCategory(row) === 'DECISION').length;
            const totalDocuments = scopedRows.filter(row => activityCategory(row) === 'DOCUMENT').length;

            const scopeButtons = [
                ['ACTIVE', 'WO Aktif'],
                ['ALL_WO', 'Semua WO'],
                ['MONTHLY', 'Bulanan']
            ];

            return `
                <div class="mb-3">
                    <div class="text-xs font-semibold uppercase tracking-wide text-neutral-300">Audit Trail</div>
                    <h2 class="text-lg font-bold text-neutral-700 mt-0.5">Activity Log</h2>
                    <p class="text-xs text-neutral-300 mt-1">Riwayat aktivitas dan keputusan berdasarkan scope audit yang dipilih. Seluruh waktu ditampilkan dalam WIB.</p>
                </div>

                <div class="rounded-2xl border border-neutral-100 bg-white p-3 mb-3">
                    <div class="text-xs font-bold text-neutral-700 mb-2">Scope Riwayat</div>
                    <div class="grid grid-cols-3 gap-1.5">
                        ${scopeButtons.map(([value, label]) => `
                            <button type="button" onclick="setActivityScopeFilter('${value}')" class="rounded-xl px-2 py-2 text-xs font-bold border ${activityScopeFilter === value ? 'bg-pln-700 text-white border-pln-700' : 'bg-white text-neutral-500 border-neutral-100'}">${label}</button>
                        `).join('')}
                    </div>
                    <div class="mt-2.5 rounded-xl bg-pln-100 border border-pln-300 px-2.5 py-2">
                        <div class="text-xs font-bold text-pln-900">${esc(scopeTitle)}</div>
                        <div class="text-xs text-neutral-500 mt-0.5">${esc(scopeSubtitle)}</div>
                    </div>
                </div>

                <div class="flex items-center justify-between gap-2 mb-1.5">
                    <div class="text-xs font-bold text-neutral-500">Ringkasan Scope</div>
                    <div class="text-xs text-neutral-300">Tidak berubah saat filter daftar digunakan</div>
                </div>
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <div class="rounded-2xl border border-neutral-100 bg-white p-3">
                        <div class="text-xs text-neutral-300">Total</div>
                        <div class="text-xl font-extrabold text-neutral-700 mt-1">${scopedRows.length}</div>
                    </div>
                    <div class="rounded-2xl border border-neutral-100 bg-white p-3">
                        <div class="text-xs text-neutral-300">Keputusan</div>
                        <div class="text-xl font-extrabold text-yellow-900 mt-1">${totalDecisions}</div>
                    </div>
                    <div class="rounded-2xl border border-neutral-100 bg-white p-3">
                        <div class="text-xs text-neutral-300">Akt. Dokumen</div>
                        <div class="text-xl font-extrabold text-pln-900 mt-1">${totalDocuments}</div>
                    </div>
                </div>

                ${renderActivityFilters(scopedRows)}

                <section>
                    <div class="flex items-center justify-between gap-2 mb-2">
                        <div>
                            <div class="text-xs font-extrabold text-neutral-700">${esc(scopeTitle)}</div>
                            <div class="text-xs text-neutral-300 mt-0.5">Urutan terbaru ditampilkan paling atas.</div>
                        </div>
                        <span class="rounded-full bg-neutral-100 text-neutral-500 px-2 py-0.5 text-xs font-bold">${filteredRows.length} hasil</span>
                    </div>
                    ${filteredRows.length
                        ? `<div>${filteredRows.map(row => renderActivityEntry(row, row._contextLabel || '')).join('')}</div>`
                        : `<div class="rounded-2xl border border-neutral-100 bg-white p-6 text-center">
                            <div class="text-xs font-bold text-neutral-700">Belum ada aktivitas</div>
                            <div class="text-xs text-neutral-300 mt-1">Tidak ada riwayat yang sesuai dengan scope dan filter saat ini.</div>
                           </div>`}
                </section>
            `;
        }

        function renderWorkTab() {
            const role = getRoleObj(currentRole);
            const items = getTrackerItemsForRole(currentRole);
            const groups = { ACTION: [], WAITING: [], HOLD: [], DONE: [] };

            items.forEach(item => groups[normalizeWorkGroup(item.kind)].push(item));

            const counters = [
                { key: 'ACTION', label: 'Perlu Tindakan', value: groups.ACTION.length, cls: 'bg-yellow-100 text-yellow-900 border-yellow-100' },
                { key: 'WAITING', label: 'Menunggu', value: groups.WAITING.length, cls: 'bg-pln-100 text-pln-900 border-pln-100' },
                { key: 'HOLD', label: 'On Hold', value: groups.HOLD.length, cls: 'bg-yellow-100 text-yellow-900 border-yellow-100' }
            ];

            if (items.length === 0) {
                return `
                    <div class="mb-2">
                        <div class="text-xs font-semibold uppercase tracking-wide text-neutral-300">Pekerjaan</div>
                        <h2 class="text-lg font-bold text-neutral-700 mt-0.5">Pekerjaan ${role.short}</h2>
                        <p class="text-xs text-neutral-300 mt-1">Semua pekerjaan yang perlu Anda kerjakan atau pantau berada di sini.</p>
                    </div>
                    <div class="bg-white rounded-2xl p-8 text-center border border-neutral-100/80">
                        <div class="w-11 h-11 rounded-2xl bg-pln-100 text-pln-700 flex items-center justify-center mx-auto mb-2 text-lg"><i class="fa-solid fa-briefcase"></i></div>
                        <div class="font-bold text-xs text-neutral-700">Belum ada pekerjaan</div>
                        <div class="text-xs text-neutral-300 mt-1">Pekerjaan akan muncul setelah peran ini membuat, menerima, atau memproses dokumen.</div>
                    </div>
                `;
            }

            return `
                <div class="mb-3">
                    <div class="text-xs font-semibold uppercase tracking-wide text-neutral-300">Pekerjaan</div>
                    <h2 class="text-lg font-bold text-neutral-700 mt-0.5">Pekerjaan ${role.short}</h2>
                    <p class="text-xs text-neutral-300 mt-1">Satu tempat untuk mengerjakan tugas dan memantau proses yang sudah Anda tangani.</p>
                </div>

                <div class="grid grid-cols-3 gap-1.5 mb-4">
                    ${counters.map(c => `
                        <div class="rounded-xl border px-2 py-2 text-center ${c.cls}">
                            <div class="text-base leading-none font-extrabold">${c.value}</div>
                            <div class="text-xs font-bold mt-1 leading-tight">${c.label}</div>
                        </div>
                    `).join('')}
                </div>

                <div class="space-y-4">
                    ${renderWorkSection('ACTION', groups.ACTION)}
                    ${renderWorkSection('WAITING', groups.WAITING)}
                    ${renderWorkSection('HOLD', groups.HOLD)}
                    ${renderWorkSection('DONE', groups.DONE)}
                </div>
            `;
        }


        function managerialIsTerminal(wo) {
            return ['COMPLETED', 'CANCELLED', 'STOPPED'].includes(wo?.overallStatus);
        }

        function managerialIsLate(wo) {
            if (!wo || managerialIsTerminal(wo) || wo.overallStatus === 'DRAFT') return false;
            const planStore = wo.documents?.['05'];
            if (!planStore) return false;
            const raw = getFieldValueByLabel('05', planStore, 'Jadwal Selesai');
            if (!raw) return false;
            const plannedFinish = new Date(raw).getTime();
            return Number.isFinite(plannedFinish) && plannedFinish < Date.now();
        }

        function managerialStageMeta(wo) {
            if (!wo) return { key: 'UNKNOWN', label: 'Belum diketahui', icon: 'fa-circle-question', cls: 'bg-neutral-100 text-neutral-500' };
            if (wo.overallStatus !== 'DRAFT') syncWorkflow(wo);
            const e = ensureWorkflowMeta(wo);

            if (wo.overallStatus === 'DRAFT') return { key: 'DRAFT', label: 'Draft WO', icon: 'fa-pen', cls: 'bg-neutral-100 text-neutral-500' };
            if (wo.overallStatus === 'CANCELLED') return { key: 'CANCELLED', label: 'Dibatalkan', icon: 'fa-ban', cls: 'bg-red-100 text-red-700' };
            if (wo.overallStatus === 'STOPPED') return { key: 'STOPPED', label: 'Dihentikan', icon: 'fa-circle-stop', cls: 'bg-red-100 text-red-700' };
            if (wo.overallStatus === 'COMPLETED') return { key: 'COMPLETED', label: 'Administrasi selesai', icon: 'fa-circle-check', cls: 'bg-pln-100 text-pln-900' };
            if (e.OPS_DONE) return { key: 'CLOSING', label: 'Penyelesaian administrasi', icon: 'fa-box-archive', cls: 'bg-pln-100 text-pln-900' };
            if (e.ALL_PREP_COMPLETE || wo.flows?.['OPS']?.started) return { key: 'EXECUTION', label: 'Pelaksanaan & pengawasan', icon: 'fa-helmet-safety', cls: 'bg-pln-100 text-pln-900' };
            if (e.AUTH_VALID || e.SP2B_APPROVED || e.SP3B_APPROVED || e.CHECKLIST_DOC_APPROVED) return { key: 'PREPARATION', label: 'Persiapan kerja', icon: 'fa-clipboard-check', cls: 'bg-pln-100 text-pln-900' };
            if (e.SURVEY_APPROVED || e.PLAN_COMPLETED || e.JSA_APPROVED || e.IBPPR_APPROVED) return { key: 'RISK_PLAN', label: 'Perencanaan & risiko', icon: 'fa-list-check', cls: 'bg-pln-100 text-pln-900' };
            if (e.SURVEY_RESULT_AVAILABLE || e.WO_PRIORITY_SET) return { key: 'SURVEY', label: 'Survei & analisis awal', icon: 'fa-map-location-dot', cls: 'bg-yellow-100 text-yellow-900' };
            return { key: 'APPROVAL', label: 'Pengajuan & persetujuan WO', icon: 'fa-file-circle-check', cls: 'bg-pln-100 text-pln-900' };
        }

        function managerialCurrentProcess(wo) {
            if (!wo) return '—';
            if (wo.overallStatus === 'COMPLETED') return 'WO selesai';
            if (wo.overallStatus === 'CANCELLED') return 'WO dibatalkan';
            if (wo.overallStatus === 'STOPPED') return 'WO dihentikan';

            const active = [];
            Object.entries(wo.flows || {}).forEach(([code, flowState]) => {
                if (!flowState || !JOURNEYS[code]) return;
                const nodeObj = JOURNEYS[code].nodes?.[flowState.node];
                if (!nodeObj) return;
                if (['end_good', 'end_bad', 'connector', 'wait'].includes(nodeObj.type)) return;
                if (!requirementsMet(wo, nodeObj)) return;
                if (wo.overallStatus === 'ON_HOLD' && !isHoldResolutionNode(flowState.node, nodeObj)) return;
                active.push({
                    code,
                    label: nodeObj.label,
                    role: resolveNodeRole(wo, nodeObj.role)
                });
            });

            if (!active.length) return managerialStageMeta(wo).label;
            const first = active[0];
            const role = getRoleObj(first.role);
            return `${first.label} · ${role.short}`;
        }

        function managerialHoldReason(wo) {
            if (!wo || wo.overallStatus !== 'ON_HOLD') return '';
            for (const [code, flowState] of Object.entries(wo.flows || {})) {
                const journey = JOURNEYS[code];
                const nodeObj = journey?.nodes?.[flowState?.node];
                if (!nodeObj) continue;
                if (nodeObj.allowWhileHold || isHoldResolutionNode(flowState.node, nodeObj)) {
                    return journey.title.replace(/^\w+\s*·\s*/, '');
                }
            }
            return 'Kendala proses';
        }

        function managerialAttentionItems() {
            const items = [];
            const spvTasks = getPendingTasks('SPV').filter(t => t.woId !== 'BULANAN');
            const spvTaskByWO = new Map();
            spvTasks.forEach(task => {
                if (!spvTaskByWO.has(task.woId)) spvTaskByWO.set(task.woId, task);
            });

            workOrders.forEach(wo => {
                if (!wo || wo.overallStatus === 'DRAFT' || managerialIsTerminal(wo)) return;
                syncWorkflow(wo);

                const task = spvTaskByWO.get(wo.id);
                if (isProposedEmergencyWO(wo)) {
                    items.push({
                        priority: 0,
                        wo,
                        title: 'Usulan Emergency perlu ditinjau',
                        detail: `${task?.nodeObj?.label || managerialCurrentProcess(wo)} · Alasan: ${wo.emergencyReason || 'Belum dicatat'}`,
                        icon: 'fa-triangle-exclamation',
                        cls: 'bg-red-100 text-red-700 border-red-100',
                        task: task || null
                    });
                    return;
                }

                if (wo.overallStatus === 'ON_HOLD') {
                    items.push({
                        priority: 1,
                        wo,
                        title: 'WO On Hold',
                        detail: managerialHoldReason(wo),
                        icon: 'fa-circle-pause',
                        cls: 'bg-yellow-100 text-yellow-900 border-yellow-100',
                        task
                    });
                    return;
                }

                if (managerialIsLate(wo)) {
                    items.push({
                        priority: 2,
                        wo,
                        title: 'Melewati jadwal rencana',
                        detail: managerialCurrentProcess(wo),
                        icon: 'fa-clock',
                        cls: 'bg-red-100 text-red-700 border-red-100',
                        task
                    });
                    return;
                }

                if (task) {
                    items.push({
                        priority: 3,
                        wo,
                        title: 'Butuh tindakan Supervisor',
                        detail: task.nodeObj.label,
                        icon: 'fa-circle-exclamation',
                        cls: 'bg-yellow-100 text-yellow-900 border-yellow-100',
                        task
                    });
                    return;
                }

                if (hasEvent(wo, 'OPS_DONE') && wo.overallStatus !== 'COMPLETED') {
                    items.push({
                        priority: 4,
                        wo,
                        title: 'Operasional selesai, administrasi belum ditutup',
                        detail: managerialCurrentProcess(wo),
                        icon: 'fa-file-circle-exclamation',
                        cls: 'bg-pln-100 text-pln-900 border-pln-100',
                        task: null
                    });
                }
            });

            return items.sort((a, b) => a.priority - b.priority || a.wo.id.localeCompare(b.wo.id));
        }

                                            <div class="text-xs text-red-700/80 mt-1">${managerialCurrentProcess(wo)}</div>

        /********************************************************************
         * 5. MODAL AKSI RINGKAS
         ********************************************************************/
        function openTaskModal(woId, journeyCode) {
            const modal = document.getElementById('actionModal');
            const body = document.getElementById('modalBody');
            const journey = JOURNEYS[journeyCode];

            let nodeId, wo, actualRole;
            if (journeyCode === '14') {
                nodeId = monthlyReportState.node;
                actualRole = journey.nodes[nodeId].role;
            } else {
                wo = workOrders.find(w => w.id === woId);
                nodeId = wo.flows[journeyCode].node;
                actualRole = resolveNodeRole(wo, journey.nodes[nodeId].role);
            }

            const nodeObj = journey.nodes[nodeId];
            const mergedReview = getMergedReviewDecision(journeyCode, nodeId);
            const mergedDecisionNode = mergedReview?.decisionNode || null;
            const isPriorityPlanningTask = nodeObj?.bpmnRef === 'Node_prioritas_wo';
            const isWOApprovalContext = journeyCode === '01' && ['Node_periksa_wo_asman', 'Node_periksa_wo_supervisor', 'Node_periksa_wo_manajer'].includes(nodeObj?.bpmnRef);
            const isRegularScheduleTask = nodeObj?.bpmnRef === 'Node_konfirmasi_jadwal_reguler';
            const isExecutionPlanTask = nodeObj?.bpmnRef === 'Node_rencana_pelaksanaan';
            const isInitialAnalysisTask = nodeObj?.bpmnRef === 'Node_susun_analisis_awal';
            const isSurveyRiskReviewTask = nodeObj?.bpmnRef === 'Node_supervisor_surv';
            const roleDocumentEditableLabels = getTaskDocumentEditableLabels(journeyCode, nodeObj?.bpmnRef, actualRole);
            const hasRoleDocumentEdit = roleDocumentEditableLabels.length > 0;
            const isRoleScopedDocument = ['01', '03', '04', '06', '08', '09', '10', '11', '12', '13', '14'].includes(journeyCode);
            const scopedEditableLabels = isPriorityPlanningTask
                ? ['Skala Prioritas']
                : (hasRoleDocumentEdit ? roleDocumentEditableLabels : null);
            const documentShouldBeReadOnly = isPriorityPlanningTask
                ? false
                : (!!mergedDecisionNode
                    ? !hasRoleDocumentEdit
                    : (isRoleScopedDocument && !hasRoleDocumentEdit));
            const rObj = getRoleObj(actualRole);

            let documentStore = emptyDocumentStore();
            let analysisSurveyStore = null;
            let analysisJsaStore = null;
            let analysisIbpprStore = null;

            if ((isInitialAnalysisTask || isSurveyRiskReviewTask) && wo) {
                analysisSurveyStore = ensureDocumentStore(wo, '02');
                analysisJsaStore = ensureDocumentStore(wo, '03');
                analysisIbpprStore = ensureDocumentStore(wo, '04');
                applyDocumentDefaults(wo, '02', analysisSurveyStore);
                applyDocumentDefaults(wo, '03', analysisJsaStore);
                applyDocumentDefaults(wo, '04', analysisIbpprStore);
            } else if (DOCUMENT_SCHEMAS[journeyCode]) {
                documentStore = journeyCode === '14'
                    ? (monthlyReportState.documentData || emptyDocumentStore())
                    : ensureDocumentStore(wo, journeyCode);
                if (wo) applyDocumentDefaults(wo, journeyCode, documentStore);
            }

            body.innerHTML = `
                <div class="flex items-center justify-between pb-2.5 mb-3 border-b border-neutral-100">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-white px-2 py-0.5 rounded-md ${rObj.color}">${rObj.short}</span>
                        <span class="font-bold text-xs text-neutral-700">${journey.title}</span>
                    </div>
                    <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-neutral-100 text-neutral-500 flex items-center justify-center text-xs">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="mb-3">
                    <div class="text-xs font-semibold text-neutral-300">${wo ? wo.id : monthlyReportState.period}</div>
                    <h3 class="font-bold text-lg text-neutral-700">${mergedDecisionNode ? `${nodeObj.label} & Keputusan` : nodeObj.label}</h3>
                    ${mergedDecisionNode ? `<div class="text-xs text-neutral-300 mt-0.5">Pemeriksaan dan keputusan dilakukan dalam satu langkah.</div>` : ''}
                </div>

                ${nodeObj.externalNote ? `
                    <div class="mb-3 rounded-xl bg-white border border-neutral-100 p-2.5 text-xs leading-relaxed text-neutral-500">
                        <i class="fa-solid fa-circle-info text-pln-700 mr-1"></i>${nodeObj.externalNote}
                    </div>
                ` : ''}

                ${isWOApprovalContext && wo && !wo.handlingMode ? `
                    <div class="mb-3 rounded-2xl border ${wo.proposedHandlingMode === 'EMERGENCY' ? 'border-red-100 bg-red-100' : 'border-neutral-100 bg-white'} p-3">
                        <div class="flex items-center justify-between gap-2">
                            <div class="text-xs font-extrabold ${wo.proposedHandlingMode === 'EMERGENCY' ? 'text-red-700' : 'text-neutral-700'}">
                                ${wo.proposedHandlingMode === 'EMERGENCY' ? '<i class="fa-solid fa-triangle-exclamation mr-1"></i>EMERGENCY' : 'USUL REGULER'}
                            </div>
                            <span class="text-xs font-semibold text-neutral-500">Final oleh Supervisor</span>
                        </div>
                        ${wo.proposedHandlingMode === 'EMERGENCY' ? `
                            <div class="text-xs text-neutral-700 leading-relaxed mt-2"><b>Alasan urgensi:</b> ${esc(wo.emergencyReason || 'Belum diisi')}</div>
                            <div class="text-xs text-neutral-500 mt-1.5">Gunakan informasi ini sebagai konteks pemeriksaan WO. Status Emergency belum final pada tahap ini.</div>
                        ` : `
                            <div class="text-xs text-neutral-500 mt-1.5">WO diajukan sebagai Reguler. Jenis penanganan final tetap dikonfirmasi Supervisor setelah approval.</div>
                        `}
                    </div>
                ` : ''}

                ${wo && isEmergencyWO(wo) ? `
                    <div class="mb-3 rounded-xl border border-red-100 bg-red-100 p-2.5 text-xs leading-relaxed text-red-700">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i><b>EMERGENCY FAST TRACK</b> · Task untuk WO ini diprioritaskan. Seluruh safety/readiness tetap wajib.
                    </div>

        function executeMergedReviewStep(woId, journeyCode, choice) {
            const journey = JOURNEYS[journeyCode];
            const reviewNote = document.getElementById('taskNoteInput')?.value.trim() || '';

            // Reviewer hanya membaca dokumen. Tidak ada saveDocumentForm di jalur review.
            if (journeyCode === '14') {
                const taskNodeId = monthlyReportState.node;
                const mergedReview = getMergedReviewDecision(journeyCode, taskNodeId);
                if (!mergedReview) return executeStep(woId, journeyCode, 'NEXT');

                const taskNode = journey.nodes[taskNodeId];
                const decisionNode = mergedReview.decisionNode;
                const nextNodeKey = choice === 'YES' ? decisionNode.yes : decisionNode.no;

                const monthlyEditableFields = getTaskDocumentEditableLabels(journeyCode, taskNode.bpmnRef, taskNode.role);
                if (monthlyEditableFields.length && DOCUMENT_SCHEMAS[journeyCode]) {
                    saveDocumentForm(woId, journeyCode, false);
                }

                recordMonthlyActivity(
                    taskNode.role,
                    taskNode.label,
                    choice === 'YES' ? (decisionNode.yesLabel || 'Setujui') : (decisionNode.noLabel || 'Tolak'),
                    reviewNote,
                    { bpmnRef: taskNode.bpmnRef || '', category: 'DECISION' }
                );
                monthlyReportState.started = true;
                monthlyReportState.node = nextNodeKey;
                const nextNode = journey.nodes[nextNodeKey];
                monthlyReportState.status = nextNode?.type === 'end_good' ? 'DONE' : 'ACTIVE';

                closeModal();
                renderLoggedInUser();
                renderCreateButton();
                renderMainView();
                showToast(choice === 'YES' ? 'Pemeriksaan disetujui' : 'Pemeriksaan ditolak', choice === 'YES' ? 'success' : 'warning');
                return;
            }

            const wo = workOrders.find(w => w.id === woId);
            if (!wo) return;


            syncWorkflow(wo);

            const flowState = wo.flows[journeyCode];
            const taskNodeId = flowState.node;
            const taskNode = journey.nodes[taskNodeId];
            const mergedReview = getMergedReviewDecision(journeyCode, taskNodeId);
            if (!taskNode || !mergedReview) return executeStep(woId, journeyCode, 'NEXT');

            if (!requirementsMet(wo, taskNode)) {
                showToast(taskNode.waitFor || 'Prasyarat belum terpenuhi', 'warning');
                closeModal();
                return;
            }
            if (wo.overallStatus === 'ON_HOLD' && !isHoldResolutionNode(taskNodeId, taskNode)) {
                showToast('WO sedang On Hold. Selesaikan kendala terlebih dahulu.', 'warning');
                closeModal();
                return;
            }

            const decisionNode = mergedReview.decisionNode;
            const actionRole = resolveNodeRole(wo, taskNode.role);
            const roleEditableReviewFields = getTaskDocumentEditableLabels(journeyCode, taskNode.bpmnRef, actionRole);
            if (roleEditableReviewFields.length && DOCUMENT_SCHEMAS[journeyCode]) {
                saveDocumentForm(woId, journeyCode, false);
            }
            recordActivity(
                wo,
                actionRole,
                journeyCode,
                taskNode.label,
                choice === 'YES' ? (decisionNode.yesLabel || 'Setujui') : (decisionNode.noLabel || 'Tolak'),
                reviewNote,
                { bpmnRef: taskNode.bpmnRef || '', category: 'DECISION' }
            );
            const nextNodeKey = choice === 'YES' ? decisionNode.yes : decisionNode.no;
            const choiceEffect = choice === 'YES' ? decisionNode.yesEffect : decisionNode.noEffect;

            flowState.started = true;
            flowState.node = nextNodeKey;
            const nextNodeObj = journey.nodes[nextNodeKey];
            if (!nextNodeObj) return;

            if (nextNodeObj.type === 'end_good') flowState.status = 'DONE';
            else if (nextNodeObj.type === 'end_bad') flowState.status = 'STOPPED';
            else flowState.status = 'ACTIVE';

            if (taskNode.sideEffect) triggerSideEffect(wo, taskNode.sideEffect);
            if (decisionNode.sideEffect) triggerSideEffect(wo, decisionNode.sideEffect);
            if (choiceEffect) triggerSideEffect(wo, choiceEffect);
            if (nextNodeObj.sideEffect && ['end_good', 'end_bad', 'connector'].includes(nextNodeObj.type)) {
                triggerSideEffect(wo, nextNodeObj.sideEffect);
            }

            syncWorkflow(wo);

            closeModal();
            renderLoggedInUser();
            renderWOSelector();
            renderCreateButton();
            renderMainView();
            showToast(choice === 'YES' ? 'Pemeriksaan disetujui' : 'Pemeriksaan ditolak', choice === 'YES' ? 'success' : 'warning');
        }

        function executeStep(woId, journeyCode, choice) {
            const journey = JOURNEYS[journeyCode];

            let currentNodeForSave = null;
            let selectedHandlingMode = null;
            if (journeyCode === '14') {
                currentNodeForSave = journey.nodes[monthlyReportState.node];
            } else {
                const woForSave = workOrders.find(w => w.id === woId);
                currentNodeForSave = woForSave ? journey.nodes[woForSave.flows[journeyCode]?.node] : null;
            }

            if (currentNodeForSave?.bpmnRef === 'Node_prioritas_wo') {
                selectedHandlingMode = document.getElementById('handlingModeFinalSelect')?.value || 'REGULAR';
                const priorityWO = workOrders.find(w => w.id === woId);
                const proposedMode = priorityWO?.proposedHandlingMode || 'REGULAR';
                const supervisorNote = document.getElementById('taskNoteInput')?.value.trim() || '';
                if (selectedHandlingMode !== proposedMode && !supervisorNote) {
                    showToast('Jelaskan alasan perubahan Jenis Penanganan pada arahan Supervisor.', 'warning');
                    return;
                }
            }

            if (currentNodeForSave?.bpmnRef === 'Node_rencana_pelaksanaan') {
                const planData = collectDocumentForm('documentFieldsRoot');
                const plannedStart = getFieldValueByLabel('05', planData, 'Jadwal Mulai').trim();
                const plannedFinish = getFieldValueByLabel('05', planData, 'Jadwal Selesai').trim();
                if (!plannedStart || !plannedFinish) {
                    showToast('Jadwal Mulai dan Jadwal Selesai wajib diisi pada Rencana Pelaksanaan.', 'warning');
                    return;
                }
                if (plannedFinish < plannedStart) {
                    showToast('Jadwal Selesai tidak boleh lebih awal dari Jadwal Mulai.', 'warning');
                    return;
                }
            }

            const isInitialAnalysisSave = currentNodeForSave?.bpmnRef === 'Node_susun_analisis_awal';
            if (isInitialAnalysisSave) {
                saveDocumentFormFromRoot(woId, '03', 'analysisJsaRoot', false);
                saveDocumentFormFromRoot(woId, '04', 'analysisIbpprRoot', false);
            } else if (DOCUMENT_SCHEMAS[journeyCode]) {
                saveDocumentForm(woId, journeyCode, false);
            }

            if (journeyCode === '14') {
                const curNode = journey.nodes[monthlyReportState.node];
                let nextNodeKey = curNode.next;
                if (curNode.type === 'decision') nextNodeKey = choice === 'YES' ? curNode.yes : curNode.no;

                const monthlyTaskNote = document.getElementById('taskNoteInput')?.value.trim() || '';
                recordMonthlyActivity(
                    curNode.role,
                    curNode.label,
                    curNode.type === 'decision'
                        ? (choice === 'YES' ? (curNode.yesLabel || 'Ya') : (curNode.noLabel || 'Tidak'))
                        : (curNode.actionText || 'Selesai'),
                    monthlyTaskNote,
                    { bpmnRef: curNode.bpmnRef || '', category: curNode.type === 'decision' ? 'DECISION' : 'WORKFLOW' }
                );
                monthlyReportState.started = true;
                monthlyReportState.node = nextNodeKey;
                const nextNode = journey.nodes[nextNodeKey];
                monthlyReportState.status = nextNode?.type === 'end_good' ? 'DONE' : 'ACTIVE';

                closeModal();
                renderLoggedInUser();
                renderCreateButton();
                renderMainView();
                showToast('Laporan Bulanan diperbarui', 'success');
                return;
            }

            const wo = workOrders.find(w => w.id === woId);
            if (!wo) return;

            if (currentNodeForSave?.bpmnRef === 'Node_prioritas_wo') {
                wo.handlingMode = selectedHandlingMode || wo.proposedHandlingMode || 'REGULAR';
                markEvent(wo, 'HANDLING_MODE_CONFIRMED');
                const priorityStore = wo.documents?.['01'];
                if (priorityStore) wo.priority = getFieldValueByLabel('01', priorityStore, 'Skala Prioritas').trim() || wo.priority || 'Normal';

            }

            syncWorkflow(wo);

            const flowState = wo.flows[journeyCode];
            const curNode = journey.nodes[flowState.node];
            if (!curNode) return;

            if (curNode.type === 'wait' || curNode.type === 'connector') {
                showToast(curNode.waitFor || 'Tahap ini menunggu kondisi proses lain', 'warning');
                closeModal();
                return;
            }
            if (!requirementsMet(wo, curNode)) {
                showToast(curNode.waitFor || 'Prasyarat belum terpenuhi', 'warning');
                closeModal();
                return;
            }
            if (wo.overallStatus === 'ON_HOLD' && !isHoldResolutionNode(flowState.node, curNode)) {
                showToast('WO sedang On Hold. Selesaikan kendala terlebih dahulu.', 'warning');
                closeModal();
                return;
            }

            flowState.started = true;

            const taskNote = document.getElementById('taskNoteInput')?.value.trim() || '';
            const actionRole = resolveNodeRole(wo, curNode.role);
            const isPriorityDecision = curNode.bpmnRef === 'Node_prioritas_wo';
            const actionOutcome = isPriorityDecision
                ? `${wo.handlingMode === 'EMERGENCY' ? 'Emergency Fast Track' : 'Reguler'} · Prioritas: ${wo.priority || 'Normal'}`
                : (curNode.type === 'decision'
                    ? (choice === 'YES' ? (curNode.yesLabel || 'Ya') : (curNode.noLabel || 'Tidak'))
                    : (curNode.actionText || 'Selesai'));
            recordActivity(
                wo,
                actionRole,
                journeyCode,
                curNode.label,
                actionOutcome,
                taskNote,
                { bpmnRef: curNode.bpmnRef || '', category: (curNode.type === 'decision' || isPriorityDecision) ? 'DECISION' : 'WORKFLOW' }
            );

            let nextNodeKey = curNode.next;
            let choiceEffect = null;
            if (curNode.type === 'decision') {
                nextNodeKey = choice === 'YES' ? curNode.yes : curNode.no;
                choiceEffect = choice === 'YES' ? curNode.yesEffect : curNode.noEffect;
            }

            flowState.node = nextNodeKey;
            const nextNodeObj = journey.nodes[nextNodeKey];
            if (!nextNodeObj) return;

            if (nextNodeObj.type === 'end_good') flowState.status = 'DONE';
            else if (nextNodeObj.type === 'end_bad') flowState.status = 'STOPPED';
            else flowState.status = 'ACTIVE';

            if (curNode.sideEffect) triggerSideEffect(wo, curNode.sideEffect);
            if (choiceEffect) triggerSideEffect(wo, choiceEffect);

            if (nextNodeObj.sideEffect && ['end_good', 'end_bad', 'connector'].includes(nextNodeObj.type)) {
                triggerSideEffect(wo, nextNodeObj.sideEffect);
            }

            syncWorkflow(wo);

            closeModal();
            renderLoggedInUser();
            renderWOSelector();
            renderCreateButton();
            renderMainView();
        }

            const container = document.getElementById('toastContainer');

            const toast = document.createElement('div');
            toast.className = 'pointer-events-auto flex items-center gap-2.5 rounded-2xl border border-yellow-700 bg-yellow-500 px-3 py-2.5 shadow-lg text-neutral-900';
            toast.innerHTML = `
                <i class="fa-solid fa-bell text-sm text-neutral-900 shrink-0"></i>
                <span class="text-sm font-semibold text-neutral-900">${message}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-4px]', 'transition', 'duration-200');
                setTimeout(() => toast.remove(), 220);
            }, 2600);
        }
