        function getDocumentRoleFields(journeyCode, role) {
            return DOCUMENT_ROLE_FIELDS[journeyCode]?.[role] || [];
        }

        function getTaskDocumentEditableLabels(journeyCode, bpmnRef, role) {
            const taskRule = DOCUMENT_TASK_FIELDS[journeyCode]?.[bpmnRef];
            if (taskRule) {
                const allowedRoles = taskRule.roles || (taskRule.role ? [taskRule.role] : []);
                return allowedRoles.includes(role) ? taskRule.fields : [];
            }
            const allowedTasks = DOCUMENT_ROLE_TASKS[journeyCode]?.[role] || [];
            if (!bpmnRef || !allowedTasks.includes(bpmnRef)) return [];
            return getDocumentRoleFields(journeyCode, role);
        }

        function ensureDocumentStore(wo, journeyCode) {
            if (!wo.documents) wo.documents = {};
            if (!wo.documents[journeyCode]) wo.documents[journeyCode] = emptyDocumentStore();
            return wo.documents[journeyCode];
        }

        function getDocumentStore(woId, journeyCode) {
            if (journeyCode === '14') {
                if (!monthlyReportState.documentData) monthlyReportState.documentData = emptyDocumentStore();
                return monthlyReportState.documentData;
            }
            const wo = workOrders.find(w => w.id === woId);
            if (!wo) return emptyDocumentStore();
            return ensureDocumentStore(wo, journeyCode);
        }

        function esc(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function applyDocumentDefaults(wo, journeyCode, store) {
            if (!wo || !DOCUMENT_SCHEMAS[journeyCode]) return store;
            const schema = DOCUMENT_SCHEMAS[journeyCode];
            const defaultsByLabel = {
                'Nomor WO': wo.id,
                'Nomor Work Order': wo.id,
                'Jenis Pekerjaan': wo.title,
                'Jenis Pekerjaan / Katalog': wo.title,
                'Nama pekerjaan': wo.title,
                'Lokasi': wo.location,
                'Lokasi / Alamat': wo.location,
                'Nama jalan/lokasi': wo.location,
                'Area Kerja / Work Area': wo.location,
                'Skala Prioritas': wo.priority || ''
            };

            schema.sections.forEach(section => {
                (section.fields || []).forEach(field => {
                    if (store.fields[field.key] === undefined && defaultsByLabel[field.label] !== undefined) {
                        store.fields[field.key] = defaultsByLabel[field.label];
                    }
                });
            });
            return store;
        }

        function getFieldValueByLabel(journeyCode, store, label) {
            const schema = DOCUMENT_SCHEMAS[journeyCode];
            if (!schema) return '';
            for (const section of schema.sections) {
                const field = (section.fields || []).find(f => f.label === label);
                if (field) return store?.fields?.[field.key] ?? '';
            }
            return '';
        }

        function renderSingleDocumentField(field, value, attrs = '') {
            const base = 'w-full text-sm rounded-xl border border-neutral-100 px-2.5 py-2 bg-white focus:outline-none focus:border-pln-700 disabled:bg-white disabled:text-neutral-500 disabled:cursor-default disabled:opacity-100';
            const safeValue = esc(value ?? '');

            if (field.type === 'checkbox') {
                return `
                    <label class="flex items-start gap-2.5 rounded-xl border border-neutral-100 bg-white p-2.5">
                        <input type="checkbox" data-doc-field="${esc(field.key)}" ${value === true || value === 'true' ? 'checked' : ''} ${attrs}
                               class="mt-0.5 rounded border-neutral-100 text-pln-700 focus:ring-pln-700 disabled:opacity-100 disabled:cursor-default">
                        <span class="text-xs leading-relaxed text-neutral-700">${esc(field.label)}</span>
                    </label>
                `;
            }

            if (field.type === 'textarea') {
                return `
                    <label class="block">
                        <span class="block text-xs font-semibold text-neutral-500 mb-1">${esc(field.label)}</span>
                        <textarea data-doc-field="${esc(field.key)}" ${attrs} rows="2" class="${base} resize-y">${safeValue}</textarea>
                    </label>
                `;
            }

            if (field.type === 'file') {
                return `
                    <label class="block">
                        <span class="block text-xs font-semibold text-neutral-500 mb-1">${esc(field.label)}</span>
                        <input type="file" data-doc-field="${esc(field.key)}" data-existing="${safeValue}" ${attrs}
                               class="w-full text-xs rounded-xl border border-neutral-100 px-2 py-2 bg-white file:mr-2 file:rounded-lg file:border-0 file:bg-neutral-100 file:px-2 file:py-1 file:text-xs file:font-semibold">
                        ${safeValue ? `<div class="text-xs text-neutral-300 mt-1"><i class="fa-solid fa-paperclip mr-1"></i>Tersimpan: ${safeValue}</div>` : ''}
                    </label>
                `;
            }

            const type = ['date','datetime-local','number','tel'].includes(field.type) ? field.type : 'text';
            const icon = field.type === 'signature'
                ? '<i class="fa-solid fa-signature text-neutral-300 mr-1"></i>'
                : '';
            return `
                <label class="block">
                    <span class="block text-xs font-semibold text-neutral-500 mb-1">${icon}${esc(field.label)}</span>
                    <input type="${type}" data-doc-field="${esc(field.key)}" value="${safeValue}" ${attrs} class="${base}">
                </label>
            `;
        }

        function getRepeatableRows(section, store) {
            const existing = store.repeatables?.[section.key];
            if (Array.isArray(existing) && existing.length) return existing;
            if (Array.isArray(section.seedRows) && section.seedRows.length) {
                return section.seedRows.map(row => ({ ...row }));
            }
            return [{}];
        }

        function renderDocumentForm(journeyCode, store, options = {}) {
            const schema = DOCUMENT_SCHEMAS[journeyCode];
            if (!schema) return '';
            const rootId = options.rootId || 'documentFieldsRoot';
            const woId = options.woId || '';
            const reopenJourneyCode = options.reopenJourneyCode || journeyCode;
            const readOnly = options.readOnly === true;
            const editableLabels = Array.isArray(options.editableLabels) ? options.editableLabels : null;
            const scopedEdit = !!editableLabels;
            const allowRowsWithScopedEdit = options.allowRowsWithScopedEdit === true;
            const allowRows = options.allowRows !== false && !readOnly && (!scopedEdit || allowRowsWithScopedEdit);
            const readOnlyAttrs = readOnly ? 'disabled aria-readonly="true"' : '';

            function fieldAttrs(field, extra = '') {
                if (readOnly) return `${extra} disabled aria-readonly="true"`;
                if (scopedEdit && !editableLabels.includes(field.label)) {
                    return `${extra} disabled aria-readonly="true"`;
                }
                return extra;
            }

            return `
                <div id="${rootId}" data-document-code="${journeyCode}" class="mb-3">
                    <div class="rounded-2xl border border-neutral-100 bg-white/70 overflow-hidden">
                        <div class="px-3 py-2.5 border-b border-neutral-100 bg-white flex items-center justify-between gap-2">
                            <div>
                                <div class="text-base font-bold text-neutral-700">Isian Dokumen</div>
                                <div class="text-xs text-neutral-300 mt-0.5">${esc(schema.title)}</div>
                            </div>
                            <div class="flex items-center gap-1.5">
                                ${readOnly ? `<span class="text-xs font-bold px-2 py-1 rounded-lg bg-neutral-100 text-neutral-500"><i class="fa-solid fa-lock mr-1"></i>Hanya baca</span>` : ''}
                                ${scopedEdit ? `<span class="text-xs font-bold px-2 py-1 rounded-lg bg-yellow-100 text-yellow-900"><i class="fa-solid fa-pen mr-1"></i>Edit terbatas</span>` : ''}
                                <span class="text-xs font-bold px-2 py-1 rounded-lg ${schema.formatType === 'Sumber format' ? 'bg-pln-100 text-pln-900' : 'bg-yellow-100 text-yellow-900'}">
                                    ${esc(schema.formatType || 'Format')}
                                </span>
                            </div>
                        </div>

                        <div class="p-2.5 space-y-2">
                            ${schema.sections.map((section, sectionIndex) => {
                                if (section.type === 'reference') {
                                    return `
                                        <details class="rounded-xl border border-neutral-100 bg-white" ${sectionIndex === 0 ? 'open' : ''}>
                                            <summary class="cursor-pointer px-2.5 py-2 text-xs font-bold text-neutral-700">${esc(section.title)}</summary>
                                            <div class="px-2.5 pb-2.5 space-y-1">
                                                ${section.items.map(item => `<div class="text-xs text-neutral-500 leading-relaxed">• ${esc(item)}</div>`).join('')}
                                            </div>
                                        </details>
                                    `;
                                }

                                if (section.type === 'repeatable') {
                                    const rows = getRepeatableRows(section, store);
                                    return `
                                        <details class="rounded-xl border border-neutral-100 bg-white" ${sectionIndex === 0 ? 'open' : ''}>
                                            <summary class="cursor-pointer px-2.5 py-2 text-xs font-bold text-neutral-700">${esc(section.title)}</summary>
                                            <div class="px-2.5 pb-2.5 space-y-2">
                                                ${section.notes?.length ? `<div class="text-xs text-neutral-300 leading-relaxed">${section.notes.map(esc).join('<br>')}</div>` : ''}
                                                <div data-repeatable-section="${esc(section.key)}" class="space-y-2">
                                                    ${rows.map((row, rowIndex) => `
                                                        <div class="rounded-xl border border-neutral-100 bg-white p-2.5">
                                                            <div class="flex items-center justify-between mb-2">
                                                                <span class="text-xs font-bold text-neutral-500">Baris ${rowIndex + 1}</span>
                                                                ${allowRows && rows.length > 1 ? `
                                                                    <button type="button" onclick="removeDocumentRow('${woId}','${journeyCode}','${section.key}',${rowIndex},'${rootId}','${reopenJourneyCode}')" class="text-xs text-red-700 font-semibold">
                                                                        <i class="fa-solid fa-trash-can mr-1"></i>Hapus
                                                                    </button>
                                                                ` : ''}
                                                            </div>
                                                            <div class="grid grid-cols-1 gap-2">
                                                                ${section.fields.map(field =>
                                                                    renderSingleDocumentField(
                                                                        field,
                                                                        row[field.key] ?? '',
                                                                        fieldAttrs(field, `data-repeat-section="${esc(section.key)}" data-repeat-row="${rowIndex}"`)
                                                                    )
                                                                ).join('')}
                                                            </div>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                                ${allowRows ? `
                                                    <button type="button" onclick="addDocumentRow('${woId}','${journeyCode}','${section.key}','${rootId}','${reopenJourneyCode}')" class="w-full rounded-xl border border-dashed border-pln-300 bg-pln-100/50 text-pln-700 py-2 text-xs font-bold">
                                                        <i class="fa-solid fa-plus mr-1"></i>Tambah baris
                                                    </button>
                                                ` : ''}
                                            </div>
                                        </details>
                                    `;
                                }

                                return `
                                    <details class="rounded-xl border border-neutral-100 bg-white" ${sectionIndex === 0 ? 'open' : ''}>
                                        <summary class="cursor-pointer px-2.5 py-2 text-xs font-bold text-neutral-700">${esc(section.title)}</summary>

                                            <div class="grid grid-cols-1 gap-2">
                                                ${section.fields.map(field =>
                                                    renderSingleDocumentField(field, store.fields?.[field.key] ?? '', fieldAttrs(field))
                                                ).join('')}

                                        </div>

                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function collectDocumentForm(rootId = 'documentFieldsRoot') {
            const root = document.getElementById(rootId);
            const store = emptyDocumentStore();
            if (!root) return store;

            root.querySelectorAll('[data-doc-field]').forEach(el => {
                const key = el.dataset.docField;
                const repeatSection = el.dataset.repeatSection;
                const repeatRow = el.dataset.repeatRow;

                let value;
                if (el.type === 'checkbox') value = el.checked;
                else if (el.type === 'file') value = el.files?.[0]?.name || el.dataset.existing || '';
                else value = el.value;

                if (repeatSection !== undefined && repeatRow !== undefined) {
                    if (!store.repeatables[repeatSection]) store.repeatables[repeatSection] = [];
                    const idx = Number(repeatRow);
                    while (store.repeatables[repeatSection].length <= idx) store.repeatables[repeatSection].push({});
                    store.repeatables[repeatSection][idx][key] = value;
                } else {
                    store.fields[key] = value;
                }
            });

            return store;
        }

        function saveDocumentFormFromRoot(woId, journeyCode, rootId = 'documentFieldsRoot', showMessage = true) {
            if (!DOCUMENT_SCHEMAS[journeyCode]) return;
            const collected = collectDocumentForm(rootId);

            if (journeyCode === '14') {
                monthlyReportState.documentData = collected;
            } else {
                const wo = workOrders.find(w => w.id === woId);
                if (!wo) return;
                if (!wo.documents) wo.documents = {};
                wo.documents[journeyCode] = collected;
            }

            if (showMessage) showToast('Isian dokumen disimpan', 'success');
        }

        function saveDocumentForm(woId, journeyCode, showMessage = true) {
            saveDocumentFormFromRoot(woId, journeyCode, 'documentFieldsRoot', showMessage);
        }

        function addDocumentRow(woId, journeyCode, sectionKey, rootId = 'documentFieldsRoot', reopenJourneyCode = journeyCode) {
            saveDocumentFormFromRoot(woId, journeyCode, rootId, false);
            const store = getDocumentStore(woId, journeyCode);
            if (!store.repeatables[sectionKey]) store.repeatables[sectionKey] = [];
            store.repeatables[sectionKey].push({});
            openTaskModal(woId, reopenJourneyCode);
        }

        function removeDocumentRow(woId, journeyCode, sectionKey, rowIndex, rootId = 'documentFieldsRoot', reopenJourneyCode = journeyCode) {
            saveDocumentFormFromRoot(woId, journeyCode, rootId, false);
            const store = getDocumentStore(woId, journeyCode);
            const rows = store.repeatables[sectionKey] || [];
            if (rows.length <= 1) return;
            rows.splice(rowIndex, 1);
            openTaskModal(woId, reopenJourneyCode);
        }


        /********************************************************************
         * DOCUMENT UTILITY POC — SP2B PREVIEW / PRINT / PDF
         * Utility only; does not advance or alter BPMN workflow state.
         ********************************************************************/
        function hasDocumentContent(store) {
            if (!store) return false;
            const fields = Object.values(store.fields || {});
            const rows = Object.values(store.repeatables || {}).flatMap(rows => Array.isArray(rows) ? rows : []);
            return fields.some(v => v !== '' && v !== null && v !== undefined && v !== false) ||
                rows.some(row => Object.values(row || {}).some(v => v !== '' && v !== null && v !== undefined && v !== false));
        }

        function isSP2BPrintEligible(wo) {
            if (!wo) return false;
            inferWorkflowEvents(wo);
            return !!ensureWorkflowMeta(wo).SP2B_APPROVED;
        }

        function isSP2BReceiptComplete(wo) {
            if (!wo) return false;
            inferWorkflowEvents(wo);
            return !!ensureWorkflowMeta(wo).SP2B_RECEIPT_RECORDED;
        }

        function formatDocumentPrintValue(value, type = 'text') {
            if (value === true || value === 'true') return 'Ya';
            if (value === false || value === 'false') return 'Tidak';
            const text = String(value ?? '').trim();
            if (!text) return '—';
            if (type === 'signature') return `Ditandatangani: ${text}`;
            return text;
        }

        function printFieldRow(label, value, type = 'text') {
            return `
                <div class="sp2b-print-row">
                    <div class="sp2b-print-label">${esc(label)}</div>
                    <div class="sp2b-print-value">${esc(formatDocumentPrintValue(value, type))}</div>
                </div>
            `;

            return getFieldValueByLabel('08', store, label);

                    <div class="sp2b-statusline">
                        <span class="sp2b-status ${eligible ? 'final' : 'draft'}">${eligible ? (receiptComplete ? 'SP2B + TANDA TERIMA LENGKAP' : 'SP2B DISETUJUI') : 'DRAFT · PREVIEW'}</span>

                    <section class="sp2b-section">

                    <section class="sp2b-section">
                        <h2>Pengesahan SP2B</h2>
                        <div class="sp2b-sign-grid">
                            ${signFields.map(label => {
                                const field = allFields.find(f => f.label === label);
                                return `
                                    <div class="sp2b-sign-box">
                                        <div class="sp2b-sign-label">${esc(label)}</div>
                                        <div class="sp2b-sign-value">${esc(formatDocumentPrintValue(getSP2BField(store, label), field?.type))}</div>
                                    </div>

                    <section class="sp2b-section sp2b-receipt-section">

                                </thead>
                                <tbody>
                                    ${(executorRows.length ? executorRows : [{}]).map(row => `
                                        <tr>${repeatableFields.map(field => `<td>${esc(formatDocumentPrintValue(row?.[field.key], field.type))}</td>`).join('')}</tr>

        function renderSP2BDocumentUtility(woId) {

            if (!wo || !hasDocumentContent(wo.documents?.['08'])) return '';
            const eligible = isSP2BPrintEligible(wo);

        function previewSP2BFromCurrentContext(woId) {
            const root = document.getElementById('documentFieldsRoot');
            if (root?.dataset?.documentCode === '08') {
                saveDocumentFormFromRoot(woId, '08', 'documentFieldsRoot', false);
            }

        function openSP2BDocumentPreview(woId) {
            const wo = workOrders.find(w => w.id === woId);
            if (!wo) return;
            const modal = document.getElementById('documentPreviewModal');
            const toolbar = document.getElementById('documentPreviewToolbar');
            const body = document.getElementById('documentPreviewBody');
            const eligible = isSP2BPrintEligible(wo);
            const receiptComplete = isSP2BReceiptComplete(wo);

            toolbar.innerHTML = `
                <div class="bg-white border-b border-neutral-100 px-3 py-2.5 flex items-center justify-between gap-2">
                    <button type="button" onclick="closeSP2BDocumentPreview()" class="w-9 h-9 rounded-xl bg-neutral-100 text-neutral-700 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="min-w-0 flex-1">
                        <div class="text-sm font-bold text-neutral-700 truncate">Preview SP2B</div>
                        <div class="text-xs text-neutral-500 truncate">${esc(wo.id)} · ${eligible ? (receiptComplete ? 'SP2B + Tanda Terima Lengkap' : 'SP2B Disetujui') : 'Draft'}</div>
                    </div>
                    <span class="text-xs font-bold px-2 py-1 rounded-lg ${eligible ? 'bg-pln-100 text-pln-900' : 'bg-yellow-100 text-yellow-900'}">${eligible ? (receiptComplete ? 'Siap Arsip' : 'Untuk Penyerahan') : 'Belum Final'}</span>
                </div>
                <div class="bg-white border-b border-neutral-100 px-3 py-2 grid grid-cols-2 gap-2">
                    <button type="button" ${eligible ? `onclick="printSP2BDocument('${woId}')"` : 'disabled'} class="rounded-xl border px-3 py-2.5 text-sm font-semibold flex items-center justify-center gap-2 ${eligible ? 'border-neutral-100 text-neutral-700 bg-white' : 'border-neutral-100 text-neutral-300 bg-neutral-100 cursor-not-allowed'}">
                        <i class="fa-solid fa-print"></i>Cetak
                    </button>
                    <button type="button" ${eligible ? `onclick="saveSP2BPDF('${woId}')"` : 'disabled'} class="rounded-xl px-3 py-2.5 text-sm font-semibold flex items-center justify-center gap-2 ${eligible ? 'bg-yellow-500 text-neutral-900' : 'bg-neutral-100 text-neutral-300 cursor-not-allowed'}">
                        <i class="fa-solid fa-file-pdf"></i>Simpan PDF
                    </button>
                </div>
                ${!eligible ? `<div class="bg-yellow-100 border-b border-yellow-300 px-3 py-2 text-xs text-yellow-900"><i class="fa-solid fa-lock mr-1"></i>Preview masih berupa draft. Cetak dan Simpan PDF aktif setelah SP2B disetujui Manajer.</div>` : (!receiptComplete ? `<div class="bg-pln-100 border-b border-pln-300 px-3 py-2 text-xs text-pln-900"><i class="fa-solid fa-handshake mr-1"></i>Output ini digunakan untuk penyerahan SP2B. Bagian Tanda Terima masih kosong/belum lengkap dan akan terisi setelah Pelaksana menerima SP2B.</div>` : `<div class="bg-pln-100 border-b border-pln-300 px-3 py-2 text-xs text-pln-900"><i class="fa-solid fa-box-archive mr-1"></i>SP2B dan Tanda Terima sudah lengkap. PDF siap digunakan sebagai arsip.</div>`)}
            `;
            body.innerHTML = `${renderSP2BPrintStyles()}${renderSP2BPrintTemplate(wo)}`;
            modal.classList.remove('hidden');
        }

        function closeSP2BDocumentPreview() {
            document.getElementById('documentPreviewModal')?.classList.add('hidden');
        }

        function saveSP2BPDF(woId) {
            const wo = workOrders.find(w => w.id === woId);
            if (!wo || !isSP2BPrintEligible(wo)) {
                showToast('SP2B belum final. PDF hanya dapat disimpan setelah persetujuan Manajer.', 'warning');
                return;
            }
            const element = document.getElementById('sp2bPrintableDocument');
            if (!element) return;
            if (typeof html2pdf === 'undefined') {
                showToast('Modul PDF belum tersedia. Periksa koneksi internet lalu coba lagi.', 'warning');
                return;
            }
            const number = (getSP2BField(wo.documents?.['08'], 'Nomor surat (halaman 1)') || wo.id).replace(/[^a-zA-Z0-9_-]+/g, '_');
            const options = {
                margin: 0,
                filename: `SP2B_${number}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['css', 'legacy'] }
            };

            const exportHost = document.createElement('div');
            exportHost.style.position = 'fixed';
            exportHost.style.left = '-10000px';
            exportHost.style.top = '0';
            exportHost.style.width = '210mm';
            exportHost.style.background = '#fff';
            const exportClone = element.cloneNode(true);
            exportClone.style.width = '210mm';
            exportClone.style.maxWidth = 'none';
            exportClone.style.minHeight = '297mm';
            exportHost.appendChild(exportClone);
            document.body.appendChild(exportHost);

            showToast('Menyiapkan PDF SP2B...', 'info');
            html2pdf().set(options).from(exportClone).save()
                .then(() => showToast('PDF SP2B berhasil disimpan.', 'success'))
                .catch(() => showToast('PDF gagal dibuat. Coba gunakan tombol Cetak sebagai alternatif.', 'warning'))
                .finally(() => exportHost.remove());
        }

        function printSP2BDocument(woId) {
            const wo = workOrders.find(w => w.id === woId);
            if (!wo || !isSP2BPrintEligible(wo)) {
                showToast('SP2B belum final dan belum dapat dicetak.', 'warning');
                return;
            }
            const popup = window.open('', '_blank', 'width=900,height=1100');
            if (!popup) {
                showToast('Browser memblokir jendela cetak. Izinkan pop-up lalu coba lagi.', 'warning');
                return;
            }
            popup.document.write(`<!doctype html><html><head><meta charset="UTF-8"><title>SP2B ${esc(wo.id)}</title>${renderSP2BPrintStyles()}</head><body>${renderSP2BPrintTemplate(wo)}</body></html>`);
            popup.document.close();
            popup.focus();
            setTimeout(() => popup.print(), 200);
        }


        /********************************************************************
         * GENERIC DOCUMENT UTILITY — DOKUMEN 01–14
         * Preview tidak mengubah state BPMN. Cetak/PDF mengikuti finalisasi
         * masing-masing dokumen.
         ********************************************************************/
        const DOCUMENT_OUTPUT_REQUIREMENTS = {
            '01': 'setelah approval WO selesai dan Supervisor menetapkan prioritas serta jenis penanganan',
            '02': 'setelah hasil survei disetujui',
            '03': 'setelah JSA disetujui',
            '04': 'setelah IBPPR disetujui',
            '05': 'setelah Rencana Pelaksanaan selesai disusun',
            '06': 'setelah Izin Kerja Ketinggian siap digunakan',
            '07': 'setelah Surat Kewenangan dinyatakan valid',
            '08': 'setelah SP2B disetujui Manajer',
            '09': 'setelah SP3B disetujui Manajer',
            '10': 'setelah Checklist disetujui Supervisor dan Kepala Regu',
            '11': 'setelah Berita Acara Delegasi ditandatangani dan diarsipkan',
            '12': 'setelah Pemberitahuan Penyelesaian diterima Kepala Operasi',
            '13': 'setelah laporan dan dokumen pekerjaan diarsipkan',
            '14': 'setelah Laporan Bulanan disetujui Manajer'
        };

        function getDocumentContextStore(woId, journeyCode) {
            if (journeyCode === '14') {
                if (!monthlyReportState.documentData) monthlyReportState.documentData = emptyDocumentStore();
                return monthlyReportState.documentData;
            }
            if (woId === '__TRANSIENT__' && transientDocumentPreview?.journeyCode === journeyCode) {
                return transientDocumentPreview.store || emptyDocumentStore();
            }
            const wo = workOrders.find(w => w.id === woId);
            return wo ? ensureDocumentStore(wo, journeyCode) : emptyDocumentStore();
        }

        function getDocumentContextWO(woId, journeyCode) {
            if (journeyCode === '14') return null;
            if (woId === '__TRANSIENT__' && transientDocumentPreview?.journeyCode === journeyCode) {
                return transientDocumentPreview.wo || null;
            }
            return workOrders.find(w => w.id === woId) || null;
        }

        function getDocumentOutputState(woId, journeyCode) {
            const wo = getDocumentContextWO(woId, journeyCode);
            if (woId === '__TRANSIENT__') {
                return {
                    eligible: false,
                    archiveReady: false,
                    label: 'Preview Draft',
                    message: 'Ini hanya preview sebelum pengajuan. Cetak dan Simpan PDF aktif setelah Work Order melewati approval dan penetapan prioritas.'
                };
            }
            let eligible = false;
            let archiveReady = false;
            let label = 'Draft';
            let message = `Cetak dan Simpan PDF aktif ${DOCUMENT_OUTPUT_REQUIREMENTS[journeyCode] || 'setelah dokumen final'}.`;

            if (journeyCode === '14') {
                const approved = monthlyReportState.status === 'DONE' || ['n_e', 'n_f', 'n_g', 'n_z'].includes(monthlyReportState.node);
                const archived = monthlyReportState.status === 'DONE';
                eligible = approved;
                archiveReady = archived;
                label = archived ? 'Siap Arsip' : (approved ? 'Disetujui' : 'Draft');
                message = archived
                    ? 'Laporan Bulanan sudah diterima pada akhir alur dan siap diarsipkan sebagai PDF.'
                    : (approved
                        ? 'Laporan Bulanan sudah disetujui Manajer dan dapat dicetak/disimpan sebagai PDF.'
                        : `Cetak dan Simpan PDF aktif ${DOCUMENT_OUTPUT_REQUIREMENTS['14']}.`);
                return { eligible, archiveReady, label, message };
            }

            if (!wo) return { eligible, archiveReady, label, message };
            inferWorkflowEvents(wo);
            const e = ensureWorkflowMeta(wo);
            const flow = wo.flows?.[journeyCode];

            switch (journeyCode) {
                case '01':
                    eligible = !!e.WO_PRIORITY_SET;
                    archiveReady = wo.overallStatus === 'COMPLETED';
                    label = archiveReady ? 'Siap Arsip' : (eligible ? 'WO Disetujui' : 'Draft');
                    break;
                case '02':
                    eligible = !!e.SURVEY_APPROVED;
                    archiveReady = eligible;
                    label = eligible ? 'Disetujui' : 'Draft';
                    break;
                case '03':
                    eligible = !!e.JSA_APPROVED;
                    archiveReady = eligible;
                    label = eligible ? 'Disetujui' : 'Draft';
                    break;
                case '04':
                    eligible = !!e.IBPPR_APPROVED;
                    archiveReady = eligible;
                    label = eligible ? 'Disetujui' : 'Draft';
                    break;
                case '05':
                    eligible = !!e.PLAN_COMPLETED;
                    archiveReady = eligible;
                    label = eligible ? 'Rencana Final' : 'Draft';
                    break;
                case '06':
                    eligible = !!e.HEIGHT_PERMIT_READY || !!e.HEIGHT_PERMIT_COMPLETE;
                    archiveReady = !!e.HEIGHT_PERMIT_COMPLETE;
                    label = archiveReady ? 'Siap Arsip' : (eligible ? 'Untuk Pelaksanaan' : 'Draft');
                    break;
                case '07':
                    eligible = !!e.AUTH_VALID;
                    archiveReady = eligible;
                    label = eligible ? 'Valid' : 'Draft';
                    break;
                case '08':
                    eligible = !!e.SP2B_APPROVED;
                    archiveReady = !!e.SP2B_RECEIPT_RECORDED;
                    label = archiveReady ? 'Siap Arsip' : (eligible ? 'Untuk Penyerahan' : 'Draft');
                    break;
                case '09':
                    eligible = !!e.SP3B_APPROVED;
                    archiveReady = !!e.SP3B_DELIVERED;
                    label = archiveReady ? 'Siap Arsip' : (eligible ? 'Untuk Penyerahan' : 'Draft');
                    break;
                case '10':
                    eligible = !!e.CHECKLIST_DOC_APPROVED;
                    archiveReady = !!e.CHECKLIST_PHYSICAL_READY || flow?.status === 'DONE';
                    label = archiveReady ? 'Siap Arsip' : (eligible ? 'Untuk Pelaksanaan' : 'Draft');
                    break;
                case '11':
                    eligible = !!e.DELEGATION_RESOLVED || flow?.status === 'DONE';
                    archiveReady = eligible;
                    label = eligible ? 'Siap Arsip' : 'Draft';
                    break;
                case '12':
                    eligible = !!e.NOTIF_RECEIVED || flow?.status === 'DONE';
                    archiveReady = eligible;
                    label = eligible ? 'Diterima' : 'Draft';
                    break;
                case '13':
                    eligible = !!e.DAILY_ARCHIVED || flow?.status === 'DONE';
                    archiveReady = eligible;
                    label = eligible ? 'Siap Arsip' : 'Draft';
                    if (!eligible && ['n_c', 'n_d'].includes(flow?.node)) {
                        message = 'Preview saat ini menampilkan bundel Dokumen 13. Pada tahap ini cukup lengkapi Laporan Hasil Pekerjaan; bagian Laporan Kinerja Harian memang belum perlu diisi dan akan dilengkapi setelah Pemberitahuan Penyelesaian diterima Kepala Operasi.';
                    } else if (!eligible && ['n_e', 'n_f', 'n_g', 'n_gq', 'n_h', 'n_i', 'n_j'].includes(flow?.node)) {
                        message = 'Bundel Dokumen 13 sedang dilengkapi. Laporan Hasil sudah tersedia dan bagian Laporan Kinerja Harian/administrasi dilengkapi pada tahap saat ini sebelum arsip final.';
                    }
                    break;
            }

            if (eligible) {
                if (archiveReady) {
                    message = 'Dokumen sudah lengkap pada tahap akhirnya dan siap dicetak/disimpan sebagai PDF untuk arsip.';
                } else if (journeyCode === '06' || journeyCode === '10') {
                    message = 'Dokumen sudah siap digunakan untuk pelaksanaan. Versi arsip akan lengkap setelah tahapan lapangan terkait selesai.';
                } else if (journeyCode === '08' || journeyCode === '09') {
                    message = 'Dokumen sudah disetujui dan dapat dicetak untuk penyerahan. Status arsip lengkap setelah proses penerimaan/penyerahan selesai.';
                } else {
                    message = 'Dokumen sudah final pada tahap ini dan dapat dicetak atau disimpan sebagai PDF.';
                }
            }
            return { eligible, archiveReady, label, message };
        }

        function genericDocumentPrintValue(value, type = 'text') {
            if (type === 'checkbox') return value === true || value === 'true' ? 'Ya' : 'Tidak';
            const text = String(value ?? '').trim();
            if (!text) return '—';
            if (type === 'signature') return `Ditandatangani: ${text}`;
            return text;
        }

        function getDocumentPrintOrientation(journeyCode) {
            const schema = DOCUMENT_SCHEMAS[journeyCode];
            if (!schema) return 'portrait';
            const maxRepeatableColumns = Math.max(0, ...schema.sections
                .filter(section => section.type === 'repeatable')
                .map(section => (section.fields || []).length));
            return maxRepeatableColumns >= 7 ? 'landscape' : 'portrait';
        }

        function renderGenericDocumentPrintTemplate(woId, journeyCode) {
            const schema = DOCUMENT_SCHEMAS[journeyCode];
            if (!schema) return '';
            const store = getDocumentContextStore(woId, journeyCode);
            const wo = getDocumentContextWO(woId, journeyCode);
            const output = getDocumentOutputState(woId, journeyCode);
            const contextTitle = journeyCode === '14'
                ? `Periode ${esc(monthlyReportState.period || '—')}`
                : `Work Order ${esc(wo?.id || '—')}`;

            const renderField = field => {
                const value = store?.fields?.[field.key];
                if (field.type === 'signature') return '';
                return `
                    <div class="generic-row">
                        <div class="generic-label">${esc(field.label)}</div>
                        <div class="generic-value">${esc(genericDocumentPrintValue(value, field.type))}</div>
                    </div>
                `;
            };

            const renderSignature = field => `
                <div class="generic-sign-box">
                    <div class="generic-sign-label">${esc(field.label)}</div>
                    <div class="generic-sign-value">${esc(genericDocumentPrintValue(store?.fields?.[field.key], field.type))}</div>
                </div>
            `;

            const sections = schema.sections.map(section => {
                const fields = section.fields || [];
                if (section.type === 'repeatable') {
                    const rows = store?.repeatables?.[section.key] || [];
                    return `
                        <section class="generic-section">
                            <h2>${esc(section.title)}</h2>
                            <div class="generic-table-wrap">

                                    <thead><tr>${fields.map(field => `<th>${esc(field.label)}</th>`).join('')}</tr></thead>
                                    <tbody>
                                        ${(rows.length ? rows : [{}]).map(row => `
                                            <tr>${fields.map(field => `<td>${esc(genericDocumentPrintValue(row?.[field.key], field.type))}</td>`).join('')}</tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    `;
                }
                const normalFields = fields.filter(field => field.type !== 'signature');
                const signatureFields = fields.filter(field => field.type === 'signature');
                return `
                    <section class="generic-section">
                        <h2>${esc(section.title)}</h2>
                        <div class="generic-fields">${normalFields.map(renderField).join('')}</div>
                        ${signatureFields.length ? `<div class="generic-sign-grid">${signatureFields.map(renderSignature).join('')}</div>` : ''}
                    </section>
                `;
            }).join('');

            return `
                <article id="genericPrintableDocument" class="generic-print-sheet">
                    ${!output.eligible ? '<div class="generic-watermark">DRAFT · BELUM FINAL</div>' : ''}
                    <div class="generic-header">

                        <div class="generic-header-copy">

                            <div class="generic-title">${esc(schema.title)}</div>
                            <div class="generic-subtitle">${contextTitle}</div>
                        </div>
                    </div>
                    <div class="generic-statusline">
                        <span class="generic-status ${output.eligible ? 'final' : 'draft'}">${esc(output.label)}</span>
                        ${wo && isEmergencyWO(wo) ? '<span class="generic-emergency">EMERGENCY</span>' : ''}
                    </div>
                    ${sections}
                    <div class="generic-footer">
                        <div>Dokumen dihasilkan dari prototype Administrasi & Monitoring PDKB.</div>
                        <div>${esc(output.label)}</div>
                    </div>
                </article>

        }

        function renderDocumentUtility(journeyCode, woId) {

        function openDocumentPreview(woId, journeyCode, logActivity = true) {

        function documentExportElement(journeyCode) {
            if (journeyCode === '08') return document.getElementById('sp2bPrintableDocument');
            return document.getElementById('genericPrintableDocument');
        }

        function documentExportStyle(journeyCode) {
            return journeyCode === '08' ? renderSP2BPrintStyles() : renderGenericDocumentPrintStyles(journeyCode);
        }

        function documentExportTemplate(woId, journeyCode) {
            if (journeyCode === '08') {
                return renderSP2BPrintTemplate(getDocumentContextWO(woId, journeyCode));
            }
            return renderGenericDocumentPrintTemplate(woId, journeyCode);
        }

        function documentExportFilename(woId, journeyCode) {
            const schema = DOCUMENT_SCHEMAS[journeyCode];
            const context = journeyCode === '14'
                ? (monthlyReportState.period || 'periode')
                : (getDocumentContextWO(woId, journeyCode)?.id || 'WO');
            const safeTitle = (schema?.title || `Dokumen_${journeyCode}`).replace(/[^a-zA-Z0-9_-]+/g, '_');
            const safeContext = String(context).replace(/[^a-zA-Z0-9_-]+/g, '_');
            return `${journeyCode}_${safeTitle}_${safeContext}.pdf`;
        }

        function saveDocumentPDF(woId, journeyCode) {
            const output = getDocumentOutputState(woId, journeyCode);
            if (!output.eligible) {
                showToast(`Dokumen belum final. PDF dapat disimpan ${DOCUMENT_OUTPUT_REQUIREMENTS[journeyCode] || 'setelah dokumen final'}.`, 'warning');
                return;
            }
            const element = documentExportElement(journeyCode);
            if (!element) return;
            if (typeof html2pdf === 'undefined') {
                showToast('Modul PDF belum tersedia. Periksa koneksi internet lalu coba lagi.', 'warning');
                return;
            }

            const orientation = journeyCode === '08' ? 'portrait' : getDocumentPrintOrientation(journeyCode);
            const pageWidth = orientation === 'landscape' ? '297mm' : '210mm';
            const pageHeight = orientation === 'landscape' ? '210mm' : '297mm';
            const options = {
                margin: 0,
                filename: documentExportFilename(woId, journeyCode),
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation },
                pagebreak: { mode: ['css', 'legacy'] }
            };

            const exportHost = document.createElement('div');
            exportHost.style.position = 'fixed';
            exportHost.style.left = '-10000px';
            exportHost.style.top = '0';
            exportHost.style.width = pageWidth;
            exportHost.style.background = '#fff';
            const exportClone = element.cloneNode(true);
            exportClone.style.width = pageWidth;
            exportClone.style.maxWidth = 'none';
            exportClone.style.minHeight = pageHeight;
            exportHost.appendChild(exportClone);
            document.body.appendChild(exportHost);

            showToast('Menyiapkan PDF...', 'info');
            html2pdf().set(options).from(exportClone).save()
                .then(() => {
                    recordDocumentUtilityActivity(
                        woId,
                        journeyCode,
                        'Simpan PDF',
                        'Berhasil disimpan',
                        `Nama file: ${documentExportFilename(woId, journeyCode)}`
                    );
                    showToast('PDF berhasil disimpan.', 'success');
                })
                .catch(() => showToast('PDF gagal dibuat. Coba gunakan tombol Cetak sebagai alternatif.', 'warning'))
                .finally(() => exportHost.remove());
        }

        function printDocument(woId, journeyCode) {
            const output = getDocumentOutputState(woId, journeyCode);
            if (!output.eligible) {
                showToast('Dokumen belum final dan belum dapat dicetak.', 'warning');
                return;
            }
            const schema = DOCUMENT_SCHEMAS[journeyCode];
            const popup = window.open('', '_blank', 'width=900,height=1100');
            if (!popup) {
                showToast('Browser memblokir jendela cetak. Izinkan pop-up lalu coba lagi.', 'warning');
                return;
            }
            popup.document.write(`
                <!doctype html>
                <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>${esc(schema?.title || 'Dokumen')}</title>
                        ${documentExportStyle(journeyCode)}
                    </head>
                    <body>${documentExportTemplate(woId, journeyCode)}</body>
                </html>
            `);
            popup.document.close();
            popup.focus();
            recordDocumentUtilityActivity(woId, journeyCode, 'Cetak dokumen', 'Dialog cetak dibuka');
            setTimeout(() => popup.print(), 200);
        }

        let currentRole = null;
        let loggedInUsername = null;
        let currentTab = 'work';
        let activeWOId = null;
        let activityTypeFilter = 'ALL';
        let activityJourneyFilter = 'ALL';
        let activityScopeFilter = 'ACTIVE';
        let activityActorFilter = 'ALL';
        let activitySearchQuery = '';

        // Tidak ada seed/demo data. Semua WO muncul hanya dari aksi pengguna.
        let workOrders = [];
        let transientDocumentPreview = null;

        // Laporan bulanan belum aktif sampai ada WO yang selesai operasional.
        let monthlyReportState = {
            period: 'Nov 2026',
            node: 'n_a',
            status: 'NOT_STARTED',
            started: false,
            documentData: { fields: {}, repeatables: {} },
            activityLog: []
        };

        /********************************************************************
         * 3. HELPER & LOGIKA INTERKONEKSI ANTAR DOKUMEN
         ********************************************************************/
        function getActiveWO() {
            return workOrders.find(w => w.id === activeWOId) || workOrders[0];
        }

        function getWOHandlingMode(wo) {
            return wo?.handlingMode || 'REGULAR';
        }

        function isEmergencyWO(wo) {
            return getWOHandlingMode(wo) === 'EMERGENCY';
        }

        function isProposedEmergencyWO(wo) {
            return wo?.proposedHandlingMode === 'EMERGENCY' && !wo?.handlingMode;
        }

        function collectNewWOHandlingInput() {
            const mode = document.getElementById('newWOHandlingMode')?.value || 'REGULAR';
            const reason = document.getElementById('newWOEmergencyReason')?.value.trim() || '';
            return { mode, reason };
        }

        function toggleNewWOEmergencyReason() {
            const mode = document.getElementById('newWOHandlingMode')?.value || 'REGULAR';
            const wrap = document.getElementById('newWOEmergencyReasonWrap');
            if (wrap) wrap.classList.toggle('hidden', mode !== 'EMERGENCY');
        }

        function syncPriorityWithHandlingMode() {
            const select = document.getElementById('handlingModeFinalSelect');
            const mode = select?.value || 'REGULAR';
            const proposedMode = select?.dataset?.proposedMode || 'REGULAR';
            const priorityField = DOCUMENT_SCHEMAS['01']?.sections
                ?.flatMap(section => section.fields || [])
                ?.find(field => field.label === 'Skala Prioritas');
            if (!priorityField) return;

            const input = document.querySelector(`#documentFieldsRoot [data-doc-field="${priorityField.key}"]`);
            const note = document.getElementById('handlingModePriorityNote');
            const overrideNote = document.getElementById('handlingModeOverrideNote');
            if (!input) return;

            if (overrideNote) {
                const changed = mode !== proposedMode;
                overrideNote.className = `text-xs mt-1.5 ${changed ? 'text-red-700 font-semibold' : 'text-neutral-500'}`;
                overrideNote.textContent = changed
                    ? 'Jenis penanganan final berbeda dari usulan pengaju. Jelaskan alasan perubahan pada Rencana kerja / arahan Supervisor.'
                    : 'Jenis penanganan final sesuai dengan usulan pengaju.';
            }

            if (mode === 'EMERGENCY') {
                input.value = 'Prioritas Tertinggi';
                input.disabled = true;
                input.setAttribute('aria-readonly', 'true');
                if (note) note.textContent = 'Emergency otomatis menetapkan Skala Prioritas = Prioritas Tertinggi.';
            } else {
                input.disabled = false;
                input.removeAttribute('aria-readonly');
                if (note) note.textContent = 'Untuk Reguler, Skala Prioritas dapat ditetapkan sesuai kebutuhan.';
            }
        }

        function validateEmergencyProposal(input) {
            if (input.mode === 'EMERGENCY' && !input.reason) {
                showToast('Alasan urgensi wajib diisi untuk WO Emergency', 'warning');
                return false;
            }
            return true;
        }

        function resolveNodeRole(wo, rawRole) {
            if (rawRole === 'DYNAMIC_TL') return wo.initiatorRole;
            return rawRole;
        }

        function getRoleObj(roleId) {
            return ROLES.find(r => r.id === roleId) || { id: roleId, name: roleId, short: roleId, color: 'bg-neutral-500' };
        }

        function getStatusStyle(status) {
            switch (status) {
                case 'DRAFT':
                    return { bg: 'bg-neutral-100 text-neutral-700 border-neutral-100', label: 'Draft', icon: 'fa-pen text-neutral-500' };
                case 'COMPLETED':
                case 'DONE':
                    return { bg: 'bg-pln-100 text-pln-900 border-pln-300', label: 'Selesai', icon: 'fa-circle-check text-pln-700' };
                case 'ON_HOLD':
                    return { bg: 'bg-yellow-100 text-yellow-900 border-yellow-300', label: 'On Hold', icon: 'fa-circle-pause text-yellow-700' };
                case 'STOPPED':
                case 'CANCELLED':
                    return { bg: 'bg-red-100 text-red-900 border-red-300', label: 'Dihentikan', icon: 'fa-circle-xmark text-red-700' };
                case 'WAITING':
                    return { bg: 'bg-neutral-100 text-neutral-500 border-neutral-100', label: 'Menunggu', icon: 'fa-clock text-neutral-300' };
                default:
                    return { bg: 'bg-pln-100 text-pln-900 border-pln-300', label: 'Proses', icon: 'fa-circle-dot text-pln-700' };
            }
        }

        let activitySequence = 0;

        function trackerTimeLabel() {
            try {
                return `${new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })} WIB`;
            } catch (e) {
                return 'Baru saja';
            }
        }

        function recordActivity(wo, roleId, journeyCode, label, outcome = '', note = '', meta = {}) {
            if (!wo) return;
            if (!wo.activityLog) wo.activityLog = [];
            wo.activityLog.push({
                id: ++activitySequence,
                roleId,
                username: meta.username || loggedInUsername || '',
                journeyCode,
                label,
                outcome,
                note: note || '',
                bpmnRef: meta.bpmnRef || '',
                category: meta.category || 'WORKFLOW',
                at: Date.now(),
                timeLabel: trackerTimeLabel()
            });
        }

        function recordMonthlyActivity(roleId, label, outcome = '', note = '', meta = {}) {
            if (!monthlyReportState.activityLog) monthlyReportState.activityLog = [];
            monthlyReportState.activityLog.push({
                id: ++activitySequence,
                roleId,
                username: meta.username || loggedInUsername || '',
                journeyCode: '14',
                label,
                outcome,
                note: note || '',
                bpmnRef: meta.bpmnRef || '',
                category: meta.category || 'WORKFLOW',
                at: Date.now(),
                timeLabel: trackerTimeLabel()
            });
        }

        function recordDocumentUtilityActivity(woId, journeyCode, label, outcome = '', note = '') {
            const meta = { category: 'DOCUMENT', bpmnRef: '' };
            if (journeyCode === '14') {
                recordMonthlyActivity(currentRole || 'SYSTEM', label, outcome, note, meta);
                return;
            }
            const wo = workOrders.find(w => w.id === woId);
            if (!wo) return;
            recordActivity(wo, currentRole || 'SYSTEM', journeyCode, label, outcome, note, meta);
        }

        function latestJourneyActivity(wo, journeyCode) {
            const rows = (wo?.activityLog || []).filter(row => row.journeyCode === journeyCode);
            return rows.length ? rows[rows.length - 1] : null;
        }

        // ================================================================
        // WORKFLOW GUARD / DEPENDENCY ENGINE (v2)
        // Draw.io tetap menjadi referensi proses. UI hanya mengeksekusi
        // user task / decision; connector bergerak otomatis saat prerequisite
        // terpenuhi.
        // ================================================================
        function ensureWorkflowMeta(wo) {
            if (!wo.events) wo.events = {};
            return wo.events;
        }

        function markEvent(wo, eventName) {
            ensureWorkflowMeta(wo)[eventName] = true;
        }

        function hasEvent(wo, eventName) {
            return !!ensureWorkflowMeta(wo)[eventName];
        }

        function requirementsMet(wo, nodeObj) {
            if (!nodeObj || !nodeObj.requires || nodeObj.requires.length === 0) return true;
            return nodeObj.requires.every(eventName => hasEvent(wo, eventName));
        }

        function isHoldResolutionNode(nodeId, nodeObj = null) {
            if (nodeObj?.allowWhileHold) return true;
            return /^n_h/.test(nodeId) || /^n_(atasi|status|perm|resume|cancel|mgr)_/.test(nodeId);
        }

        function inferWorkflowEvents(wo) {
            const e = ensureWorkflowMeta(wo);
            const f = wo.flows;

            if (f['02']?.started || f['02']?.node !== 'n_s') e.WO_PRIORITY_SET = e.WO_PRIORITY_SET || false;
            if (f['02'] && (f['02'].status === 'DONE' || !['n_s', 'n_a', 'n_b'].includes(f['02'].node))) e.SURVEY_RESULT_AVAILABLE = true;
            if (f['02']?.status === 'DONE') e.SURVEY_APPROVED = true;
            if (f['05']?.status === 'DONE') e.PLAN_COMPLETED = true;
            if (f['03']?.status === 'DONE') e.JSA_APPROVED = true;
            if (f['04']?.status === 'DONE') e.IBPPR_APPROVED = true;

            if (f['06'] && (f['06'].status === 'DONE' || ['n_ctx','n_use','n_g','n_i','n_j','n_k','n_l','n_m','n_z'].includes(f['06'].node))) e.HEIGHT_PERMIT_READY = true;
            if (f['06']?.status === 'DONE') e.HEIGHT_PERMIT_COMPLETE = true;
            if (f['07']?.status === 'DONE') e.AUTH_VALID = true;

            if (f['08'] && (f['08'].status === 'DONE' || ['n_ctx','n_f','n_g','n_i','n_z'].includes(f['08'].node))) e.SP2B_APPROVED = true;
            if (f['09'] && (f['09'].status === 'DONE' || ['n_ctx','n_f','n_g','n_i','n_z'].includes(f['09'].node))) e.SP3B_APPROVED = true;
            if (f['10'] && (f['10'].status === 'DONE' || !['n_s','n_a','n_b','n_bq','n_r','n_fix','n_h','n_ha','n_hs','n_hp','n_hr','n_hc','n_hm','n_hx'].includes(f['10'].node))) e.CHECKLIST_DOC_APPROVED = true;

            if (f['08']?.status === 'DONE') e.SP2B_RECEIPT_RECORDED = true;
            if (f['09']?.status === 'DONE') e.SP3B_DELIVERED = true;
            if (f['10']?.status === 'DONE') e.CHECKLIST_PHYSICAL_READY = true;
            if (f['11']?.status === 'DONE') e.DELEGATION_RESOLVED = true;

            if (f['OPS_PEL']?.status === 'DONE') e.OPS_PEL_ROUND_DONE = true;
            if (f['OPS_KARU']?.status === 'DONE') e.OPS_KARU_ROUND_DONE = true;
            if (f['OPS_K3']?.status === 'DONE') e.OPS_K3_ROUND_DONE = true;
            if (f['OPS']?.status === 'DONE') e.OPS_DONE = true;

            if (f['12']?.status === 'DONE') e.NOTIF_RECEIVED = true;
            if (f['13']?.status === 'DONE') e.DAILY_ARCHIVED = true;
        }

        function isAllPreparationComplete(wo) {
            const requiredEvents = [
                'SURVEY_APPROVED',
                'PLAN_COMPLETED',
                'JSA_APPROVED',
                'IBPPR_APPROVED',
                'HEIGHT_PERMIT_READY',
                'AUTH_VALID',
                'SP2B_RECEIPT_RECORDED',
                'SP3B_DELIVERED',
                'CHECKLIST_PHYSICAL_READY'
            ];
            return requiredEvents.every(eventName => hasEvent(wo, eventName));
        }

        function updateFlowStatus(wo, code) {
            const flowState = wo.flows[code];
            const journey = JOURNEYS[code];
            if (!flowState || !journey) return;

            const nodeObj = journey.nodes[flowState.node];
            if (!nodeObj) return;

            if (nodeObj.type === 'end_good') flowState.status = 'DONE';
            else if (nodeObj.type === 'end_bad') flowState.status = 'STOPPED';
            else if (nodeObj.type === 'wait' || nodeObj.type === 'connector' || !requirementsMet(wo, nodeObj)) flowState.status = 'WAITING';
            else flowState.status = 'ACTIVE';
        }

        function syncWorkflow(wo) {
            if (!wo) return;
            if (wo.overallStatus === 'DRAFT') return;
            inferWorkflowEvents(wo);

            if (isAllPreparationComplete(wo)) markEvent(wo, 'ALL_PREP_COMPLETE');

            if (wo.overallStatus !== 'ON_HOLD') {
                let changed = true;
                let guard = 0;
                while (changed && guard < 40) {
                    changed = false;
                    guard++;

                    Object.keys(wo.flows).forEach(code => {
                        const flowState = wo.flows[code];
                        const journey = JOURNEYS[code];
                        if (!flowState || !journey) return;

                        const nodeObj = journey.nodes[flowState.node];
                        if (!nodeObj || nodeObj.type !== 'connector') return;
                        if (!requirementsMet(wo, nodeObj)) return;

                        if (nodeObj.branchByHandlingMode) {
                            flowState.node = isEmergencyWO(wo) ? nodeObj.emergencyNext : nodeObj.regularNext;
                        } else {
                            flowState.node = nodeObj.next;
                        }
                        changed = true;
                    });

                    if (isAllPreparationComplete(wo)) markEvent(wo, 'ALL_PREP_COMPLETE');
                }
            }

            Object.keys(wo.flows).forEach(code => updateFlowStatus(wo, code));
        }

        // UI: task pemeriksaan + gateway persetujuan ditampilkan sebagai satu menu.
        // BPMN tetap menyimpan keduanya sebagai node terpisah; UI mengeksekusinya secara atomik.
        const MERGED_REVIEW_DECISIONS = {
            '01': { 'n_a': 'n_aq', 'n_b': 'n_bq', 'n_c': 'n_cq' },
            '02': { 'n_c': 'n_cq' },
            '03': { 'n_c': 'n_cq', 'n_e': 'n_eq' },
            '04': { 'n_c': 'n_cq', 'n_e': 'n_eq' },
            '06': { 'n_b': 'n_bq', 'n_c': 'n_cq', 'n_d': 'n_dq', 'n_e': 'n_eq' },
            '08': { 'n_b': 'n_bq', 'n_c': 'n_cq' },
            '09': { 'n_b': 'n_bq', 'n_c': 'n_cq' },
            '10': { 'n_b': 'n_bq', 'n_c': 'n_cq' },
            '12': { 'n_b': 'n_bq', 'n_d': 'n_dq', 'n_f': 'n_fq' },
            '14': { 'n_b': 'n_bq', 'n_c': 'n_cq', 'n_d': 'n_dq' }
        };

        function getMergedReviewDecision(journeyCode, nodeId) {
            const decisionId = MERGED_REVIEW_DECISIONS[journeyCode]?.[nodeId];
            if (!decisionId) return null;
            const journey = JOURNEYS[journeyCode];
            const taskNode = journey?.nodes?.[nodeId];
            const decisionNode = journey?.nodes?.[decisionId];
            if (!taskNode || !decisionNode || taskNode.next !== decisionId || decisionNode.type !== 'decision') return null;
            return { decisionId, decisionNode };
        }

        // Kumpulkan semua task yang bisa dieksekusi saat ini
        function getPendingTasks(filterRole = 'ALL') {
            const tasks = [];

            workOrders.forEach(wo => {
                if (wo.overallStatus === 'DRAFT' || wo.overallStatus === 'STOPPED' || wo.overallStatus === 'CANCELLED' || wo.overallStatus === 'COMPLETED') return;

                syncWorkflow(wo);

                Object.keys(wo.flows).forEach(jCode => {
                    const flowState = wo.flows[jCode];
                    const journey = JOURNEYS[jCode];
                    const nodeObj = journey.nodes[flowState.node];
                    if (!nodeObj) return;

                    // Connector / wait adalah kondisi sistem, bukan aksi user.
                    if (nodeObj.type === 'wait' || nodeObj.type === 'connector' || nodeObj.type === 'end_good' || nodeObj.type === 'end_bad') return;
                    if (!requirementsMet(wo, nodeObj)) return;

                    // Saat WO On Hold, hanya jalur penyelesaian kendala yang boleh berjalan.
                    if (wo.overallStatus === 'ON_HOLD' && !isHoldResolutionNode(flowState.node, nodeObj)) return;

                    const actualRole = resolveNodeRole(wo, nodeObj.role);
                    if (filterRole === 'ALL' || filterRole === actualRole) {
                        tasks.push({
                            woId: wo.id,
                            woTitle: wo.title,
                            journeyCode: jCode,
                            journeyTitle: journey.title,
                            nodeId: flowState.node,
                            nodeObj: nodeObj,
                            roleId: actualRole,
                            isEmergency: isEmergencyWO(wo),
                            proposedEmergency: isProposedEmergencyWO(wo)
                        });
                    }
                });
            });

            // Cek Journey 14 (Laporan Bulanan) hanya jika sudah dipicu oleh proses nyata.
            const mNode = JOURNEYS['14'].nodes[monthlyReportState.node];
            if (monthlyReportState.status !== 'NOT_STARTED' && mNode && mNode.type !== 'end_good') {
                if (filterRole === 'ALL' || filterRole === mNode.role) {
                    tasks.push({
                        woId: 'BULANAN',
                        woTitle: `Laporan Bulanan Periode ${monthlyReportState.period}`,
                        journeyCode: '14',
                        journeyTitle: JOURNEYS['14'].title,
                        nodeId: monthlyReportState.node,
                        nodeObj: mNode,
                        roleId: mNode.role,
                        isEmergency: false
                    });
                }
            }

            const urgencyRank = task => task.isEmergency ? 2 : (task.proposedEmergency ? 1 : 0);
            return tasks.sort((a, b) => urgencyRank(b) - urgencyRank(a));
        }

        // Efek samping otomatis antar dokumen sesuai catatan & tahap penghubung BPMN
        function startOperationalParallel(wo) {
            const events = ensureWorkflowMeta(wo);
            delete events.OPS_PEL_ROUND_DONE;
            delete events.OPS_KARU_ROUND_DONE;
            delete events.OPS_K3_ROUND_DONE;

            ['OPS_PEL', 'OPS_KARU', 'OPS_K3'].forEach(code => {
                if (!wo.flows[code]) return;
                wo.flows[code].node = 'n_exec';
                wo.flows[code].status = 'ACTIVE';
                wo.flows[code].started = true;
            });
        }

        function triggerSideEffect(wo, effectName) {
            if (!wo) return;

            switch (effectName) {
                case 'UNLOCK_SURVEY':
                    markEvent(wo, 'WO_PRIORITY_SET');
                    showToast('02 · Form Survei dibuka', 'info');
                    break;
                case 'SURVEY_SUBMITTED':
                    markEvent(wo, 'SURVEY_RESULT_AVAILABLE');
                    if (wo.flows['03']) wo.flows['03'].started = true;
                    if (wo.flows['04']) wo.flows['04'].started = true;
                    showToast('Draft JSA dan IBPPR tersedia dari hasil survei', 'info');
                    break;
                case 'SURVEY_APPROVED':
                    markEvent(wo, 'SURVEY_APPROVED');
                    showToast('Survei dinyatakan layak', 'success');
                    break;
                case 'PLAN_COMPLETED':
                    markEvent(wo, 'PLAN_COMPLETED');
                    showToast('Rencana pelaksanaan selesai', 'success');
                    break;
                case 'JSA_APPROVED':
                    markEvent(wo, 'JSA_APPROVED');
                    showToast('JSA disetujui', 'success');
                    break;
                case 'IBPPR_APPROVED':
                    markEvent(wo, 'IBPPR_APPROVED');
                    showToast('IBPPR disetujui', 'success');
                    break;
                case 'HEIGHT_PERMIT_READY':
                    markEvent(wo, 'HEIGHT_PERMIT_READY');
                    showToast('Izin Ketinggian aktif', 'success');
                    break;
                case 'HEIGHT_PERMIT_SKIP':
                    markEvent(wo, 'HEIGHT_PERMIT_READY');
                    markEvent(wo, 'HEIGHT_PERMIT_COMPLETE');
                    showToast('Izin Ketinggian tidak diperlukan', 'info');
                    break;
                case 'HEIGHT_PERMIT_COMPLETE':
                    markEvent(wo, 'HEIGHT_PERMIT_COMPLETE');
                    showToast('Izin Ketinggian selesai ditutup', 'success');
                    break;
                case 'AUTH_VALID':
                    markEvent(wo, 'AUTH_VALID');
                    showToast('Surat Kewenangan valid', 'success');
                    break;
                case 'SP2B_APPROVED':
                    markEvent(wo, 'SP2B_APPROVED');
                    showToast('SP2B disetujui', 'success');
                    break;
                case 'SP3B_APPROVED':
                    markEvent(wo, 'SP3B_APPROVED');
                    showToast('SP3B disetujui', 'success');
                    break;
                case 'CHECKLIST_DOC_APPROVED':
                    markEvent(wo, 'CHECKLIST_DOC_APPROVED');
                    showToast('Checklist disetujui', 'success');
                    break;
                case 'SP2B_RECEIPT_RECORDED':
                    markEvent(wo, 'SP2B_RECEIPT_RECORDED');
                    break;
                case 'SP3B_DELIVERED':
                    markEvent(wo, 'SP3B_DELIVERED');
                    break;
                case 'ALL_PREP_READY':
                    markEvent(wo, 'CHECKLIST_PHYSICAL_READY');
                    if (isAllPreparationComplete(wo)) markEvent(wo, 'ALL_PREP_COMPLETE');
                    showToast('Persiapan lapangan siap · tahap operasional dibuka', 'success');
                    break;
                case 'DELEGATION_REQUIRED':
                    markEvent(wo, 'DELEGATION_REQUIRED');
                    showToast('11 · Berita Acara Delegasi dibuka', 'info');
                    break;
                case 'DELEGATION_SKIPPED':
                    markEvent(wo, 'DELEGATION_RESOLVED');
                    startOperationalParallel(wo);
                    showToast('Delegasi tidak diperlukan · pelaksanaan dimulai', 'info');
                    break;
                case 'DELEGATION_RESOLVED':
                    markEvent(wo, 'DELEGATION_RESOLVED');
                    startOperationalParallel(wo);
                    showToast('Delegasi selesai · pelaksanaan dimulai', 'success');
                    break;
                case 'START_WORK_PARALLEL':
                    startOperationalParallel(wo);
                    showToast('Pelaksanaan dan pengawasan dimulai kembali', 'info');
                    break;
                case 'OPS_PEL_ROUND_DONE':
                    markEvent(wo, 'OPS_PEL_ROUND_DONE');
                    break;
                case 'OPS_KARU_ROUND_DONE':
                    markEvent(wo, 'OPS_KARU_ROUND_DONE');
                    break;
                case 'OPS_K3_ROUND_DONE':
                    markEvent(wo, 'OPS_K3_ROUND_DONE');
                    break;
                case 'PHYSICAL_DONE':
                    markEvent(wo, 'PHYSICAL_DONE');
                    showToast('Pekerjaan fisik selesai', 'success');
                    break;
                case 'OPS_DONE':
                    markEvent(wo, 'OPS_DONE');
                    if (monthlyReportState.status === 'NOT_STARTED') {
                        monthlyReportState.status = 'ACTIVE';
                        monthlyReportState.node = 'n_a';
                        monthlyReportState.started = false;
                    }
                    showToast('Pekerjaan selesai operasional', 'success');
                    break;
                case 'REPORT_RESULT_SUBMITTED':
                    markEvent(wo, 'REPORT_RESULT_SUBMITTED');
                    showToast('12 · Pemberitahuan Penyelesaian dibuka', 'info');
                    break;
                case 'NOTIF_RECEIVED':
                    markEvent(wo, 'NOTIF_RECEIVED');
                    showToast('Pemberitahuan diterima Kepala Operasi', 'success');
                    break;
                case 'DAILY_ARCHIVED':
                    markEvent(wo, 'DAILY_ARCHIVED');
                    showToast('Dokumen dan laporan pekerjaan diarsipkan', 'success');
                    break;
                case 'HOLD_WO':
                    wo.overallStatus = 'ON_HOLD';
                    showToast('WO On Hold', 'warning');
                    break;
                case 'RESUME_WO':
                    wo.overallStatus = 'IN_PROGRESS';
                    showToast('WO aktif kembali', 'success');
                    break;
                case 'STOP_WO':
                    wo.overallStatus = 'STOPPED';
                    showToast('WO dihentikan', 'error');
                    break;
                case 'CANCEL_WO':
                    wo.overallStatus = 'CANCELLED';
                    showToast('WO dibatalkan', 'error');
                    break;
                case 'COMPLETE_WO':
                    wo.overallStatus = 'COMPLETED';
                    if (wo.flows['01']) wo.flows['01'].status = 'DONE';
                    showToast('WO selesai', 'success');
                    break;
            }
        }

        function initApp() {
            workOrders.forEach(wo => syncWorkflow(wo));
            renderDemoAccounts();
            showLoginScreen();

            document.addEventListener('click', (event) => {
                const wrap = document.getElementById('createMenuWrap');
                if (wrap && !wrap.contains(event.target)) closeCreateMenu();
            });
        }

        function renderDemoAccounts() {
            const root = document.getElementById('demoAccountsList');
            if (!root) return;
            root.innerHTML = LOGIN_ACCOUNTS.map(account => {
                const role = getRoleObj(account.role);
                return `
                    <button type="button"
                            onclick="fillDemoLogin('${account.username}')"
                            class="w-full flex items-center justify-between gap-2 rounded-xl bg-white border border-neutral-100 px-2.5 py-2 text-left hover:border-pln-1000 transition">
                        <div class="min-w-0">
                            <div class="text-xs font-extrabold text-neutral-700 truncate">${role.name}</div>
                            <div class="text-xs text-neutral-300 truncate">${account.username}</div>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-neutral-300 shrink-0"></i>
                    </button>
                `;
            }).join('');
        }

        function fillDemoLogin(username) {
            const usernameInput = document.getElementById('loginUsername');
            const passwordInput = document.getElementById('loginPassword');
            if (usernameInput) usernameInput.value = username;
            if (passwordInput) passwordInput.value = DEMO_PASSWORD;
            clearLoginError();
        }

        function toggleLoginPassword() {
            const input = document.getElementById('loginPassword');
            const icon = document.getElementById('loginPasswordIcon');
            if (!input || !icon) return;
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = `fa-solid ${show ? 'fa-eye-slash' : 'fa-eye'} text-xs`;
        }

        function clearLoginError() {
            const error = document.getElementById('loginError');
            if (!error) return;
            error.classList.add('hidden');
            error.textContent = '';
        }

        function showLoginError(message) {
            const error = document.getElementById('loginError');
            if (!error) return;
            error.textContent = message;
            error.classList.remove('hidden');
        }

        function showLoginScreen() {
            const screen = document.getElementById('loginScreen');
            if (screen) screen.classList.remove('hidden');
            const password = document.getElementById('loginPassword');
            if (password) password.value = '';
            clearLoginError();
            setTimeout(() => document.getElementById('loginUsername')?.focus(), 0);
        }

        function hideLoginScreen() {
            document.getElementById('loginScreen')?.classList.add('hidden');
        }

        function renderLoggedInUser() {
            if (!currentRole) return;
            const role = getRoleObj(currentRole);
            const roleName = document.getElementById('loggedInRoleName');
            const username = document.getElementById('loggedInUsernameLabel');
            const badge = document.getElementById('loggedInRoleBadge');

            if (roleName) roleName.textContent = role.name;
            if (username) username.textContent = loggedInUsername || '';
            if (badge) {
                badge.className = 'w-9 h-9 rounded-xl bg-pln-700 text-white flex items-center justify-center shrink-0';
                badge.innerHTML = '<i class="fa-solid fa-user text-sm"></i>';
            }
        }

        function loginUser() {
            const username = (document.getElementById('loginUsername')?.value || '').trim().toLowerCase();
            const password = document.getElementById('loginPassword')?.value || '';

            if (!username || !password) {
                showLoginError('Username dan password harus diisi.');
                return;
            }

            const account = LOGIN_ACCOUNTS.find(item => item.username === username);
            if (!account || password !== DEMO_PASSWORD) {
                showLoginError('Username atau password tidak sesuai.');
                return;
            }

            loggedInUsername = account.username;
            currentRole = account.role;
            currentTab = 'work';

            hideLoginScreen();
            renderLoggedInUser();
            renderCreateButton();
            renderWOSelector();
            renderMainView();
            showToast(`Masuk sebagai ${getRoleObj(currentRole).short}`, 'success');
        }

        function logoutUser() {
            closeCreateMenu();
            closeModal();
            currentRole = null;
            loggedInUsername = null;
            currentTab = 'work';
            showLoginScreen();
        }
